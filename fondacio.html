<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fondacio Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFD;--surface:#FFFFFF;--surface-2:#F0F4F9;--ink:#1F1F1F;--ink-2:#3C4043;--muted:#70757A;
  --line:#DADCE0;--outline:#747775;--hover:rgba(31,31,31,.08);--primary:#0B57D0;--on-primary:#FFFFFF;
  --tonal:#C2E7FF;--on-tonal:#001D35;--field:#F1F3F4;--now:#EA4335;--danger:#B3261E;
  --snack:#303030;--on-snack:#F2F2F2;--snack-act:#A8C7FA;--focus:#0B57D0;
  --shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --shadow-lg:0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12),0 11px 15px -7px rgba(0,0,0,.2);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131314;--surface:#1E1F20;--surface-2:#282A2C;--ink:#E3E3E3;--ink-2:#C4C7C5;--muted:#9AA0A6;
  --line:#3C4043;--outline:#8E918F;--hover:rgba(227,227,227,.08);--primary:#A8C7FA;--on-primary:#062E6F;
  --tonal:#004A77;--on-tonal:#C2E7FF;--field:#2D2F31;--now:#F28B82;--danger:#F2B8B5;
  --snack:#E3E3E3;--on-snack:#303030;--snack-act:#0B57D0;--focus:#A8C7FA;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.35);
  --shadow-lg:0 24px 38px 3px rgba(0,0,0,.5),0 9px 46px 8px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.43 Roboto,"Google Sans",system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.sp1{flex:1}

/* ---------- barra superior ---------- */
.bar{height:64px;display:flex;align-items:center;gap:2px;padding:8px 12px 8px 8px}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative;flex:none;padding:0}
.ib:hover{background:var(--hover)}
.ib.sm{width:28px;height:28px}.ib.sm svg{width:20px;height:20px}
.ib.on{background:var(--tonal);color:var(--on-tonal)}
.logo{display:flex;align-items:center;gap:10px;padding:0 4px;min-width:204px;margin-right:12px;flex:none;font-size:22px;color:var(--ink-2);white-space:nowrap}
.logo .mk{flex:none;width:40px;height:40px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:500;font-size:20px}
.logo b{font-weight:500;color:var(--ink)}
.ttl-h{font-size:22px;line-height:28px;color:var(--ink);margin:0 0 0 12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#D93025;color:#fff;font-size:10px;line-height:16px;font-weight:500;text-align:center}
.mob{display:none!important}

/* ---------- botones ---------- */
.btn{height:36px;padding:0 16px;border:1px solid var(--outline);border-radius:18px;background:none;color:var(--primary);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;letter-spacing:.01em}
.btn:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.pri:hover{background:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15)}
.btn.txt{border-color:transparent}
.btn.del{color:var(--danger)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.hoy{color:var(--ink);height:40px;padding:0 20px;margin:0 10px 0 2px;border-radius:20px}
.hoy:hover{background:var(--hover)}
.vbtn{color:var(--ink);height:40px;padding:0 10px 0 18px;border-radius:20px;margin-left:6px;gap:4px}
.vbtn:hover{background:var(--hover)}

/* ---------- estructura ---------- */
.app{display:flex;height:calc(100% - 64px)}
.side{width:256px;flex:none;overflow-y:auto;padding:8px 8px 16px 8px}
.app.nosid .side{display:none}
.cv{flex:1;min-width:0;background:var(--surface);border-radius:16px;margin:0 0 16px 0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.app.nosid .cv{margin-left:8px}
.sp{width:328px;flex:none;background:var(--surface);border-radius:16px;margin:0 0 16px 8px;display:flex;flex-direction:column;overflow:hidden}
.rail{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}

/* ---------- barra lateral ---------- */
.crear{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);cursor:pointer;margin:0 0 20px 0}
.crear:hover{box-shadow:var(--shadow);background:color-mix(in srgb,var(--surface) 92%,var(--primary))}
.crear>svg:first-child{color:var(--primary);width:28px;height:28px}
.crear>svg:last-child{width:20px;height:20px;color:var(--ink-2);margin-left:-4px}
.mini{padding:0 4px 0 8px;margin-bottom:12px}
.mh2{display:flex;align-items:center;justify-content:space-between;padding-left:8px;margin-bottom:2px;font-weight:500;color:var(--ink)}
.mgd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px}
.mgd .dl{color:var(--muted);font-weight:500;line-height:28px}
.mgd button{width:26px;height:26px;margin:1px auto;border:0;border-radius:50%;background:none;font-size:10px;font-weight:500;cursor:pointer;padding:0;color:var(--ink)}
.mgd button:hover{background:var(--hover)}
.mgd .out{color:var(--muted)}
.mgd .sel{background:var(--tonal);color:var(--on-tonal)}
.mgd .today{background:var(--primary);color:var(--on-primary)}
.mgd .today:hover{background:var(--primary)}
.grp{margin:2px 0}
.gh{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:0 6px 0 16px;height:40px;border-radius:20px;cursor:pointer;font-size:15px;font-weight:500;color:var(--ink);text-align:left}
.gh:hover{background:var(--hover)}
.gh svg{width:22px;height:22px;transition:transform .15s}
.gh[aria-expanded=true] svg{transform:rotate(180deg)}
.cb{display:flex;align-items:center;gap:16px;min-height:32px;margin:0;font-size:14px;font-weight:400;padding:4px 12px 4px 18px;border-radius:16px;cursor:pointer;color:var(--ink-2);position:relative;line-height:1.3}
.cb:hover{background:var(--hover)}
.cb input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.bx{width:18px;height:18px;border:2px solid var(--c);border-radius:2px;flex:none;display:grid;place-items:center}
.cb input:checked+.bx{background:var(--c)}
.cb input:checked+.bx::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.cb input:focus-visible+.bx{outline:2px solid var(--focus);outline-offset:2px}
.slink{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:0 16px;height:40px;border-radius:20px;cursor:pointer;color:var(--ink-2);margin-top:10px;text-align:left}
.slink:hover{background:var(--hover)}
.slink svg{width:20px;height:20px}
.foot{font-size:12px;color:var(--muted);padding:8px 16px 0;margin:0}
/* ---------- equipo: quién eres y calendario de cada persona ---------- */
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c,#5F6368);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:500}
.av.gen{background:var(--primary);color:var(--on-primary)}
.yo{display:inline-flex;align-items:center;gap:8px;height:40px;border:1px solid var(--outline);border-radius:20px;background:none;padding:0 8px 0 6px;cursor:pointer;color:var(--ink);font:inherit;font-weight:500;margin-left:6px;max-width:220px}
.yo:hover{background:var(--hover)}
.yo span:not(.av){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yo svg{width:20px;height:20px;flex:none}
.pers{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:4px 12px 4px 14px;min-height:40px;border-radius:20px;cursor:pointer;color:var(--ink-2);text-align:left;font:inherit}
.pers:hover{background:var(--hover)}
.pers.on{background:var(--tonal);color:var(--on-tonal);font-weight:500}
.mis{margin:0 4px 10px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.mis h3{font-size:13px;font-weight:500;margin:0 0 6px;color:var(--ink)}
.mi{display:block;width:100%;border:0;background:none;text-align:left;padding:6px 4px;border-radius:8px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px;line-height:18px}
.mi:hover{background:var(--hover)}
.mi small{display:block;color:var(--muted);font-size:12px}
.mi small b{color:var(--primary);font-weight:500}
.quien{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.qbox{width:min(520px,100%);background:var(--surface);border-radius:24px;padding:28px 24px;box-shadow:var(--shadow);text-align:center}
.qbox h1{font-size:26px;font-weight:400;margin:14px 0 4px}
.qbox p{color:var(--ink-2);margin:0 0 18px}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.qp{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--line);background:none;border-radius:16px;padding:14px 8px;cursor:pointer;color:var(--ink);font:inherit;font-weight:500}
.qp:hover{background:var(--hover)}
.qp.ult{border-color:var(--primary)}
.qp .av{width:44px;height:44px;font-size:18px}
.qbox .mk{width:48px;height:48px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:inline-grid;place-items:center;font-size:24px;font-weight:500}
.qnew{display:flex;gap:8px;margin-bottom:12px}
.qnew input{flex:1}
.eqs{display:flex;flex-wrap:wrap;gap:6px}
.eqc{display:inline-flex;align-items:center;margin:0;cursor:pointer}
.eqc input{position:absolute;opacity:0;width:1px;height:1px}
.eqc span{border:1px solid var(--outline);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--ink-2)}
.eqc input:checked+span{background:var(--tonal);color:var(--on-tonal);border-color:transparent}
.eqc input:focus-visible+span{outline:2px solid var(--focus)}
.mviews{display:none;margin-bottom:12px}
.mviews button{display:flex;align-items:center;width:100%;border:0;background:none;height:44px;padding:0 20px;border-radius:22px;cursor:pointer;font-weight:500;color:var(--ink-2);text-align:left}
.mviews button.on{background:var(--tonal);color:var(--on-tonal)}

/* ---------- vista de mes ---------- */
.mg{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0}
.mc{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0 2px;min-height:0;overflow:hidden;text-align:center}
.mc:nth-child(7n){border-right:0}
.mc .dw{font-size:11px;font-weight:500;color:var(--muted);padding-top:4px;line-height:16px;letter-spacing:.8px;text-transform:uppercase}
.dn{min-width:24px;height:24px;padding:0 6px;border:0;border-radius:12px;background:none;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;margin:2px 0 2px}
.dn:hover{background:var(--hover)}
.mc.out .dn{color:var(--muted)}
.mc.today .dn{background:var(--primary);color:var(--on-primary)}
.evs{text-align:left}
.ch{display:flex;align-items:center;gap:6px;width:calc(100% - 8px);margin:0 4px 2px;height:20px;border:0;border-radius:4px;background:none;padding:0 4px;font-size:12px;line-height:20px;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-align:left}
.ch:hover{background:var(--hover)}
.ch i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.ch .ct{flex:none;color:var(--ink-2)}
.ch b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.more{display:block;width:calc(100% - 8px);margin:0 4px;height:20px;border:0;border-radius:4px;background:none;text-align:left;padding:0 6px;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer}
.more:hover{background:var(--hover)}

/* ---------- vistas de día y semana ---------- */
.tg{flex:1;overflow-y:auto;min-height:0;position:relative}
.th,.tbd{display:grid;grid-template-columns:64px repeat(var(--n),minmax(0,1fr))}
.th{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:8px}
.tz{font-size:10px;color:var(--muted);align-self:end;text-align:right;padding:0 8px 6px 0}
.thd{text-align:center;padding-bottom:8px}
.dw2{display:block;font-size:11px;font-weight:500;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;line-height:20px}
.dn2{width:46px;height:46px;border:0;border-radius:50%;background:none;font-size:26px;color:var(--ink-2);cursor:pointer;line-height:46px;padding:0}
.dn2:hover{background:var(--hover)}
.today>.dw2,.thd.today .dw2{color:var(--primary)}
.today .dn2{background:var(--primary);color:var(--on-primary)}
.gut{position:relative;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh)) no-repeat right top/8px 100%}
.gut span{position:absolute;right:12px;transform:translateY(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh))}
.te{position:absolute;border:1px solid var(--surface);border-radius:4px;background:var(--c);color:#fff;padding:1px 6px;font-size:12px;line-height:16px;text-align:left;overflow:hidden;cursor:pointer;display:block;z-index:1}
.te b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.te span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.te.one{white-space:nowrap;text-overflow:ellipsis}
.te.one b{display:inline}
.te:hover{box-shadow:var(--shadow);z-index:2}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--now)}

/* ---------- agenda ---------- */
.ag{flex:1;overflow:auto;padding:8px 0}
.agd{display:grid;grid-template-columns:132px 1fr;border-bottom:1px solid var(--line);padding:6px 8px 6px 0}
.agn{display:flex;align-items:center;gap:6px;padding-left:12px;height:44px}
.agn .dn2{width:40px;height:40px;font-size:22px;line-height:40px}
.agm{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.agd.today .agm{color:var(--primary)}
.agr{display:grid;grid-template-columns:20px 180px 1fr;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0 12px;min-height:44px;border-radius:4px;cursor:pointer;text-align:left;color:var(--ink)}
.agr:hover{background:var(--hover)}
.agr i{width:12px;height:12px;border-radius:50%;background:var(--c);justify-self:center}
.agr .at{color:var(--ink-2)}
.agr b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- tarjeta emergente y menús ---------- */
.pop{position:fixed;z-index:30;width:448px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;background:var(--surface-2);border-radius:24px;box-shadow:var(--shadow-lg);padding:8px 8px 20px}
.pop.narrow{width:232px;text-align:center;padding-bottom:12px}
.pop.sheet{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;border-radius:28px 28px 0 0;max-height:82vh}
.ptb{display:flex;justify-content:flex-end;gap:2px;margin-bottom:2px}
.ptb .ib svg{width:20px;height:20px}
.prow{display:grid;grid-template-columns:52px 1fr;align-items:start;padding:5px 16px 5px 0;color:var(--ink-2);text-align:left;overflow-wrap:anywhere}
.prow>svg{width:20px;height:20px;justify-self:center}
.prow>.sq{justify-self:center;margin-top:7px}
.sq{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.ptt{font-size:22px;line-height:28px;color:var(--ink)}
.psub{color:var(--ink-2);margin-top:2px}
.pdh{margin:-28px 0 8px}
.pdh .dw{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.pdl{text-align:left}
.pdl .ch{width:100%;margin:0 0 2px}
.menu{position:fixed;z-index:35;background:var(--surface-2);border-radius:8px;box-shadow:var(--shadow);padding:8px 0;min-width:220px}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:24px;width:100%;border:0;background:none;padding:0 16px;height:40px;cursor:pointer;text-align:left;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:0}
.menu kbd{font:inherit;color:var(--muted)}

/* ---------- panel lateral (asistente) ---------- */
.sph{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 6px 20px}
.spt{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.sps{font-size:18px;color:var(--ink);line-height:24px}
.spb{flex:1;overflow:auto;padding:4px 12px 16px}
.hint{color:var(--muted);font-size:13px;margin:8px 4px 12px}
summary{cursor:pointer;color:var(--ink-2)}

/* chat */
.chat{display:flex;flex-direction:column;flex:1;min-height:0;padding:0 12px 12px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.m2{max-width:90%;padding:8px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.m2.u{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.m2.a{align-self:flex-start;background:var(--field);border-bottom-left-radius:4px}
.m2.s{align-self:center;color:var(--muted);font-size:13px;text-align:center}
.chat form{display:flex;gap:8px;margin-top:8px}
.chat input[type=text]{flex:1;min-width:0;border-radius:24px;padding:10px 16px}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sug button{font-size:12px;border:1px solid var(--outline);background:none;border-radius:8px;padding:4px 12px;cursor:pointer;color:var(--ink-2)}
.sug button:hover{background:var(--hover)}
.act{border:1px dashed var(--outline);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:13px}

/* ---------- formularios y diálogos ---------- */
input,select,textarea{background:var(--field);border:0;border-radius:4px;padding:8px 10px;width:100%;min-height:36px}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 -2px 0 var(--primary)}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:12px;color:var(--ink-2);margin:12px 0 0;font-weight:500}
label>input,label>select,label>textarea{display:block;margin-top:4px;font-weight:400;font-size:14px;color:var(--ink)}
dialog{border:0;border-radius:28px;background:var(--surface);color:var(--ink);padding:20px 24px 24px;width:min(600px,94vw);max-height:92vh;box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{font-size:22px;font-weight:400;margin:0;line-height:28px}
dialog h3{font-size:14px;font-weight:500;margin:22px 0 2px;color:var(--ink)}
h3 small{font-weight:400;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
dialog form>.row:last-child{justify-content:flex-end;margin-top:20px!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.box{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:16px}
.box summary{font-weight:500;color:var(--ink);display:flex;align-items:center;gap:10px}
.box summary svg{width:20px;height:20px;color:var(--ink-2)}
.ttl{font-size:22px;background:none;border-radius:0;box-shadow:inset 0 -1px 0 var(--line);padding:10px 0 6px;margin:8px 0 12px 48px;width:calc(100% - 48px)}
.ttl:focus{box-shadow:inset 0 -2px 0 var(--primary)}
.fr{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;margin:8px 0}
.fr>svg{width:20px;height:20px;color:var(--ink-2);justify-self:center}
.fr.top{align-items:start}.fr.top>svg{margin-top:8px}
.dt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dt input[type=date]{flex:1 1 150px;width:auto}
.dt input[type=time]{flex:0 1 120px;width:auto}
.dact{display:flex;gap:8px;align-items:center;margin-top:22px}
.toast{position:fixed;left:24px;bottom:24px;max-width:calc(100vw - 48px);background:var(--snack);color:var(--on-snack);padding:6px 8px 6px 16px;border-radius:4px;min-height:48px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);z-index:50;transform:translateY(16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}

/* ---------- actas ---------- */
.actas{flex:1;display:flex;min-height:0}
.al{width:250px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:12px 8px}
.alh{padding:0 4px 10px}
.ali{display:block;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--ink);margin-bottom:2px}

.ali.on{background:var(--tonal);color:var(--on-tonal)}

.fchip.warnc:not(.on){border-color:#E37400;color:#B06000}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:16px 0 6px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink);font:inherit}
.card:hover{background:var(--hover)}
.card b{font-size:28px;font-weight:400;line-height:34px}
.card span{font-weight:500;font-size:14px}
.card small{font-size:12px;color:var(--muted);line-height:16px}
.card.warn b{color:#B06000}
.card.ok b{color:#188038}
.card.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.guia ol{margin:8px 0 0;padding-left:22px;line-height:1.6}
.guia-txt{max-height:55vh;overflow:auto;line-height:1.55}
.guia-txt h3{font-size:15px;font-weight:500;margin:14px 0 4px}
.guia-txt ul{margin:0;padding-left:20px}
.guia summary,.box summary{cursor:pointer;font-weight:500}
.tbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 0}
.tg2{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.tg2>summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 16px;cursor:pointer;user-select:none}
.tg2>summary::-webkit-details-marker{display:none}
.tg2>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.tg2[open]>summary::before{transform:rotate(45deg)}
.tg2>summary:hover{background:var(--hover)}
.tn{font-size:16px;font-weight:500;color:var(--ink)}
.tc{font-size:13px;color:var(--muted)}
.tc .ca{color:#B06000;font-weight:500}
.tg2[open]>summary{border-bottom:1px solid var(--line)}
.th3{font-weight:500;color:var(--ink-2);margin:0;padding:12px 16px 2px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.avs{font-size:13px;color:var(--ink-2);margin:0;padding:4px 16px 6px}
.avs b{font-weight:500}
.tr{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.th3+.tr,.avs+.tr,summary+.tr{border-top:0}
.tr.aire{box-shadow:inset 4px 0 0 #F9AB00}
.tr.hecha .tt{text-decoration:line-through;color:var(--muted)}
.tt{color:var(--ink);font-size:15px;line-height:22px;overflow-wrap:anywhere}
.tm{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.who{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-weight:500}
.who svg{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:13px;border:0}
.tag svg{width:14px;height:14px}
.tag.aire{background:#FEEFC3;color:#7A4A00}
.tag.ok{background:#E6F4EA;color:#0D652D}
.tag.habl{background:var(--tonal);color:var(--on-tonal)}
.tag.cal{background:var(--surface-2);color:var(--ink-2);cursor:pointer;font:inherit;font-size:13px}
.tag.cal:hover{background:var(--hover)}
.tacts{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px}
.btn.ok{color:#188038;border-color:#188038}
.btn.ok:hover{background:rgba(24,128,56,.08)}
.btn.habl.on{background:var(--tonal);color:var(--on-tonal);border-color:transparent}
.vacio{max-width:460px;margin:60px auto;text-align:center;color:var(--ink-2)}
.vacio svg{width:48px;height:48px;color:var(--primary)}
.vacio h2{font-weight:400;color:var(--ink)}
.pp{margin:10px 0}

.hist{font-size:13px;color:var(--ink-2);max-height:180px;overflow:auto;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.hist div{margin:2px 0}
.cf{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cf.ya{opacity:.6}

.cft{font-weight:500;margin-bottom:6px}
.cf .dt select{width:auto}
.cf .m{font-size:12px;color:var(--muted);margin-top:4px}
.warn2{color:var(--danger);font-weight:500}
.aviso{background:#FEEFC3;color:#7A4A00;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.imp{display:flex;gap:12px;align-items:flex-start;margin:0 0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px;font-weight:400;color:var(--ink)}
.imp input{width:auto;min-height:0;margin-top:4px}
.imp .m{color:var(--ink-2);font-size:13px}
.msg{white-space:pre-wrap;background:var(--field);border-radius:8px;padding:8px 10px;margin:6px 0 0;color:var(--ink-2);font-size:13px;text-align:left;max-height:300px;overflow:auto}
.allday{display:flex;flex-direction:column;gap:2px;padding:4px 4px 0;text-align:left}
.allday .ch{width:100%;margin:0;background:color-mix(in srgb,var(--c) 18%,transparent)}
@media(max-width:800px){.actas{flex-direction:column}.al{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:30vh}.ad{padding:12px}.tr{grid-template-columns:1fr}.tacts{justify-content:flex-start}.cards{grid-template-columns:repeat(2,1fr)}}

/* ---------- teléfono ---------- */
@media(max-width:800px){

  .mob{display:inline-grid!important}
  .ttl-h{font-size:18px;margin-left:4px}

  body.drw .side{transform:none;visibility:visible}
  .app.nosid .side{display:block}
  .cv,.app.nosid .cv{margin:0 4px 4px}
  .sp{position:fixed;inset:0 0 0 auto;z-index:40;width:min(400px,100%);margin:0;border-radius:0}
  .mviews{display:block}
  .two{grid-template-columns:1fr}
  .toast{left:12px;right:12px;bottom:12px;max-width:none}
  .mc .dw{font-size:10px;letter-spacing:0}
  .ch{gap:3px;padding:0 2px;margin:0 2px 2px;width:calc(100% - 4px)}
  .ch .ct{display:none}
  .th,.tbd{grid-template-columns:44px repeat(var(--n),minmax(0,1fr))}
  .gut span{right:6px;font-size:9px}
  .dn2{width:34px;height:34px;font-size:18px;line-height:34px}
  .te{padding:1px 3px;font-size:11px}
  .agd{grid-template-columns:76px 1fr}
  .agn{flex-direction:column;gap:0;height:auto;padding-left:8px}
  .agr{grid-template-columns:14px 1fr;row-gap:0;padding:6px 8px}

  .agr i{grid-row:1/3}
  .ttl{margin-left:0;width:100%}
  dialog{padding:16px 16px 20px}
}

<script>
"use strict";
const $=s=>document.querySelector(s);
const EJES={form:"Formación",com:"Comunidad",eco:"Economía circular",eq:"Equipo"};
const KEY="fondacio_v3";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const pf=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const hora=h=>{if(!h)return"";let[a,b]=h.split(":").map(Number);const p=a>=12?"p. m.":"a. m.";a=a%12||12;return`${a}:${pad(b)} ${p}`};
const fechaLarga=s=>{const d=pf(s);return`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
const ord=(a,b)=>(a.fecha+a.ini).localeCompare(b.fecha+b.ini);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mins=h=>{const[a,b]=h.split(":").map(Number);return a*60+b};

/* Todos usan el mismo formato (compatible con OpenAI), por eso cambiar de proveedor es solo cambiar la dirección, la clave y el modelo. */
const PROV={
  groq:{n:"Groq (gratis, recomendado)",url:"https://api.groq.com/openai/v1/chat/completions",model:"openai/gpt-oss-120b",donde:"console.groq.com/keys",pre:"gsk_"},
  gemini:{n:"Google Gemini (gratis)",url:"https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",model:"gemini-2.0-flash",donde:"aistudio.google.com/apikey",pre:"AIza"},
  openrouter:{n:"OpenRouter (modelos gratis)",url:"https://openrouter.ai/api/v1/chat/completions",model:"meta-llama/llama-3.3-70b-instruct:free",donde:"openrouter.ai/keys",pre:"sk-or-"},
  xai:{n:"xAI Grok (de pago)",url:"https://api.x.ai/v1/chat/completions",model:"grok-4",donde:"console.x.ai",pre:"xai-"}
};
function seed(){
  const t=new Date(),f=n=>{const d=new Date(t);d.setDate(t.getDate()+n);return iso(d)};
  return {
    eventos:[
      {id:uid(),titulo:"Reunión de equipo",eje:"eq",fecha:f(2),ini:"18:30",fin:"19:30",lugar:"Videollamada",obj:"Organizar la semana."},
      {id:uid(),titulo:"Jornada de clasificación de ropa",eje:"eco",fecha:f(4),ini:"09:00",fin:"12:00",lugar:"Sede Fondacio",obj:"Clasificar y registrar las donaciones."},
      {id:uid(),titulo:"Feria de economía circular",eje:"eco",fecha:f(12),ini:"08:00",fin:"14:00",lugar:"Parque principal",obj:"Vender ropa donada y recaudar fondos."}
    ],
    cfg:{key:"",prov:"groq",model:"openai/gpt-oss-120b"},
    chat:[]
  };
}
/* La clave de la IA se lee de un archivo local aparte, clave.js (no se sube a GitHub). Sin ese archivo, se pega una vez en Ajustes IA. */
const CLAVE_INCLUIDA=window.CLAVE_INCLUIDA||"";
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.eventos)S=seed();
S.cfg=S.cfg||{};if(!PROV[S.cfg.prov]){S.cfg.prov="groq";S.cfg.model=PROV.groq.model}S.cfg.key=S.cfg.key||CLAVE_INCLUIDA;if(S.cfg.model==="llama-3.3-70b-versatile")S.cfg.model=PROV.groq.model;S.chat=S.chat||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("No se pudo guardar en este navegador")}}
function toast(t,lbl,fn){const e=$("#toast");e.innerHTML=`<span></span>${lbl?`<button type="button">${esc(lbl)}</button>`:""}`;e.firstChild.textContent=t;
  if(lbl)e.querySelector("button").onclick=()=>{e.classList.remove("on");fn()};e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),lbl?6000:3000)}

const ic=p=>`<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${p}"/></svg>`;
const I={
  menu:ic("M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"),

  inbox:ic("M19 3H4.99c-1.11 0-1.98.89-1.98 2L3 19c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z"),

const EQ=()=>S.equipo||[];
const llave=n=>String(n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const PCOL=["#D50000","#E67C73","#F4511E","#F6BF26","#33B679","#0B8043","#039BE5","#3F51B5","#7986CB","#8E24AA","#616161","#795548"];
const colorDe=n=>{const i=EQ().findIndex(x=>llave(x)===llave(n));return PCOL[(i<0?0:i)%PCOL.length]};
const avatar=n=>n?`<span class="av" style="--c:${colorDe(n)}" aria-hidden="true">${esc(n.charAt(0).toUpperCase())}</span>`:`<span class="av gen" aria-hidden="true">${I.people}</span>`;
function paraDe(e){
  if(Array.isArray(e.para)&&e.para.length)return e.para;
  const t=e.tareaId&&S.tareas&&S.tareas.find(x=>x.id===e.tareaId),txt=llave((e.con||"")+" "+(t?t.resp:""));
  return EQ().filter(n=>new RegExp("(^|[^a-zñ])"+llave(n)+"($|[^a-zñ])").test(txt));
}
const esDe=(e,n)=>{const p=paraDe(e);return p.includes("Todos")||p.some(x=>llave(x)===llave(n))};
function delDia(k){
  const wd=pf(k).getDay();
  const a=visibles().filter(e=>e.fecha===k||(e.rep==="semanal"&&k>e.fecha&&pf(e.fecha).getDay()===wd&&(!e.hasta||k<=e.hasta))).map(e=>({t:"ev",id:e.id,titulo:e.titulo,ini:e.ini||"",fin:e.fin,lugar:e.lugar,color:COL[e.eje]||COL.eq}));
  return a.sort((x,y)=>(x.ini||"").localeCompare(y.ini||""));
}
/* hora corta, como en los chips del mes: "3 p. m.", "6:30 p. m." */
const hc=h=>{if(!h)return"";const[a,b]=h.split(":").map(Number);return`${a%12||12}${b?":"+pad(b):""} ${a>=12?"p. m.":"a. m."}`};
const rango=(i,f)=>{if(!i)return"Todo el día";if(!f)return hora(i);return(+i.slice(0,2)>=12)===(+f.slice(0,2)>=12)?`${hora(i).replace(/ [ap]\. m\.$/,"")} – ${hora(f)}`:`${hora(i)} – ${hora(f)}`};
const chip=x=>`<button class="ch" data-${x.t}="${x.id}" style="--c:${x.color}" title="${esc(x.titulo)} · ${esc(rango(x.ini,x.fin))}"><i></i><span class="ct">${esc(hc(x.ini))}</span><b>${esc(x.titulo)}</b></button>`;

/* Reparte en columnas los eventos que se cruzan, como Google Calendar */
function columnas(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);
  const grupos=[];let g=[],fin=-1;
  for(const it of items){if(g.length&&it.s>=fin){grupos.push(g);g=[]}g.push(it);fin=Math.max(fin,it.e)}
  if(g.length)grupos.push(g);
  for(const gr of grupos){const cols=[];for(const it of gr){let c=cols.findIndex(t=>t<=it.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=it.e;it.c=c}gr.forEach(it=>it.n=cols.length)}
}

function renderCal(){
  const y=cursor.getFullYear(),m=cursor.getMonth();let t=`${cap(MESES[m])} de ${y}`;
  if(vista==="sem"){const a=lunes(cursor),b=new Date(a);b.setDate(a.getDate()+6);
    if(a.getFullYear()!==b.getFullYear())t=`${cap(MESES[a.getMonth()].slice(0,3))} de ${a.getFullYear()} – ${MESES[b.getMonth()].slice(0,3)} de ${b.getFullYear()}`;
    else if(a.getMonth()!==b.getMonth())t=`${cap(MESES[a.getMonth()].slice(0,3))} – ${MESES[b.getMonth()].slice(0,3)} de ${b.getFullYear()}`;
    else t=`${cap(MESES[a.getMonth()])} de ${a.getFullYear()}`}

function renderMes(){

    h+=`<div class="mc ${d.getMonth()!==m?"out":""} ${k===hoy?"today":""}" data-d="${k}">${i<7?`<div class="dw">${DOW3[d.getDay()]}</div>`:""}<button class="dn" data-go="${k}" aria-label="${esc(cap(fechaLarga(k)))}">${d.getDate()===1?`${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`:d.getDate()}</button><div class="evs">${delDia(k).map(chip).join("")}</div></div>`}

/* Muestra solo los chips que caben en cada día y agrega «N más» */
function fitMes(){

    const ev=c.querySelector(".evs");ev.querySelector(".more")?.remove();const ch=[...ev.children];ch.forEach(x=>x.hidden=false);
    const max=Math.max(0,Math.floor((c.clientHeight-ev.offsetTop-2)/22));

function renderTiempo(n){

  const hoy=iso(new Date()),key=vista+iso(a),old=$("#cv .tg"),keep=old&&old.dataset.k===key?old.scrollTop:null;
  const ahora=new Date(),nm=ahora.getHours()*60+ahora.getMinutes();

    return`<div class="thd ${k===hoy?"today":""}"><span class="dw2">${DOW3[d.getDay()]}</span><button class="dn2" data-go="${k}" aria-label="${esc(cap(fechaLarga(k)))}">${d.getDate()}</button>${(()=>{const t=delDia(k).filter(x=>!x.ini);return t.length?`<div class="allday">${t.map(chip).join("")}</div>`:""})()}</div>`}).join("")+`</div><div class="tbd"><div class="gut">`;

    const it=delDia(k).filter(x=>x.ini).map(x=>{const s=mins(x.ini);let e=x.fin?mins(x.fin):s+60;if(e<=s)e=s+60;return{...x,s,e:Math.min(e,1440)}});columnas(it);
    return`<div class="col" data-d="${k}" style="height:${24*HH}px">${it.map(x=>{const top=x.s/60*HH,hg=Math.max((x.e-x.s)/60*HH-2,18),one=hg<38;
      return`<button class="te ${one?"one":""}" data-${x.t}="${x.id}" style="top:${top}px;height:${hg}px;left:calc(${x.c/x.n*100}% + 1px);width:calc(${100/x.n}% - ${x.n===1?12:4}px);--c:${x.color}">${one?`<b>${esc(x.titulo)}</b>, ${esc(hc(x.ini))}`:`<b>${esc(x.titulo)}</b><span>${esc(rango(x.ini,x.fin))}</span>${x.lugar?`<span>${esc(x.lugar)}</span>`:""}`}</button>`}).join("")}${k===hoy?`<div class="now" style="top:${nm/60*HH}px"></div>`:""}</div>`}).join("")+`</div></div>`;
  $("#cv").innerHTML=h;

const popEl=$("#pop");
function pop(html,anchor,on,cls){
  const r=anchor.getBoundingClientRect();
  popEl.innerHTML=html;popEl._on=on;popEl.className="pop "+(cls||"");popEl.hidden=false;
  if(innerWidth<600){popEl.classList.add("sheet");popEl.style.left=popEl.style.top=""}
  else{const w=popEl.offsetWidth,h=popEl.offsetHeight;
    let x=r.right+8;if(x+w>innerWidth-8)x=r.left-w-8;if(x<8)x=Math.max(8,Math.min(innerWidth-w-8,r.left));
    if(cls==="narrow")x=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2));
    const y=Math.max(8,Math.min(cls==="narrow"?r.top-40:r.top,innerHeight-h-8));
    popEl.style.left=x+"px";popEl.style.top=y+"px"}
  popEl.focus({preventScroll:true});
}

async function ia(msgs,sistema){
  if(!S.cfg.key)throw new Error("Falta la clave en Ajustes IA");
  let r;
  const P=PROV[S.cfg.prov]||PROV.groq;
  try{r=await fetch(P.url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+S.cfg.key},
    body:JSON.stringify({model:S.cfg.model||P.model,messages:[{role:"system",content:sistema||contexto()},...msgs],temperature:.3})})}
  catch(e){throw new Error("No se pudo conectar con "+P.n.split(" (")[0]+" (¿internet o bloqueo del navegador?)")}
  if(!r.ok){let m="Error "+r.status;try{const j=await r.json();m+=": "+(j.error?.message||j.error||"")}catch(e){}throw new Error(m.slice(0,200))}
  const j=await r.json();return j.choices?.[0]?.message?.content?.trim()||"(sin respuesta)";
}

  return{texto:txt.replace(m[0],"").trim(),acc:Array.isArray(acc)&&acc.length?acc:null};
}

/* ---------- 1. leer el .docx (es un zip) sin librerías ---------- */
async function leerDocx(file){
  const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer),dec=new TextDecoder();
  let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("no parece un archivo de Word (.docx)");
  let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true);
  for(let i=0;i<n;i++){
    const met=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    if(dec.decode(buf.subarray(p+46,p+46+nl))==="word/document.xml"){
      const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),data=buf.subarray(st,st+cs);
      if(met===0)return dec.decode(data);
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    }
    p+=46+nl+xl+cl;
  }
  throw new Error("el archivo no tiene el contenido de Word esperado");
}
const WNS="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
function parseActa(xml,nombre){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const q=(el,tag)=>[...el.getElementsByTagNameNS(WNS,tag)];
  const hijos=(el,tag)=>[...el.children].filter(c=>c.localName===tag);
  const val=(el,tag,at="val")=>{const x=q(el,tag)[0];return x?x.getAttributeNS(WNS,at)||"":""};
  const pars=tc=>q(tc,"p").map(p=>{
    const t=q(p,"t").map(x=>x.textContent).join("").replace(/\s+/g," ").trim();if(!t)return null;
    let azul=false,pend=false,tach=false,arr=false,resp="",tt=t,bul=q(p,"numPr").length>0;
    q(p,"r").forEach(r=>{const c=val(r,"color").toLowerCase(),h=val(r,"highlight"),s=val(r,"shd","fill").toLowerCase(),k=q(r,"strike")[0];
      if(c==="0000ff")azul=true;if((h&&h!=="none")||/^(ffff00|fff2cc|ff00ff)$/.test(s))pend=true;
      if(k&&!/^(0|false)$/.test(k.getAttributeNS(WNS,"val")||"")&&q(r,"t").some(x=>x.textContent.trim()))tach=true});
    const mb=tt.match(/^[•·▪◦●○■\-–]\s*/);if(mb){bul=true;tt=tt.slice(mb[0].length)}
    tt=tt.replace(/\s*✔\s*(cumplido|archivado|se decidi[oó] no hacerlo)\b.*$/i,()=>{tach=true;return""});
    tt=tt.replace(/\s*\((nuevo|desde el [^()]*|nadie lo menciona desde[^()]*)\)\s*$/i,(m,g)=>{if(!/^nuevo/i.test(g))arr=true;return""});
    tt=tt.replace(/\s+—\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s*\/\s*[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?)$/,(m,g)=>{resp=g;return""}).trim();
    if(!tt)return null;
    if(tach&&!/^(ya\s|no se)/i.test(tt))tt="Ya se hizo: "+tt;
    return{t:tt,bul,azul,pend,arr,resp}}).filter(Boolean);
  const body=q(doc,"body")[0];if(!body)throw new Error("documento vacío");
  const tablas=hijos(body,"tbl").map(t=>hijos(t,"tr").map(tr=>hijos(tr,"tc").map(tc=>({ps:pars(tc),cont:val(tc,"vMerge")===""&&q(tc,"vMerge").length>0}))));
  const txt=c=>c?c.ps.map(p=>p.t).join(" "):"";
  const a={id:uid(),archivo:nombre,fecha:"",modera:"",apunta:"",part:[],temas:[]};
  for(const t of tablas){
    const cab=sinTilde(t[0]?.map(txt).join(" ").toUpperCase()||"");
    if(t.some(r=>/^FECHA/.test(sinTilde(txt(r[0]).toUpperCase())))){
      for(const r of t){const k=sinTilde(txt(r[0]).toUpperCase()),v=txt(r[1]);
        if(k.startsWith("FECHA"))a.fecha=leerFecha(v)||"";else if(k.includes("MODERA"))a.modera=v;else if(k.includes("APUNTA"))a.apunta=v}
    }else if(cab.includes("PARTICIPANTES")){
      for(const r of t.slice(1)){const nm=txt(r[0]);if(!nm)continue;a.part.push({n:cap(nm.toLowerCase()),logros:(r[1]?.ps||[]).map(p=>p.t),mejorar:(r[2]?.ps||[]).map(p=>p.t)})}
    }else if(cab.includes("TEMA")&&cab.includes("COMPROMISO")){
      const H=t[0].map(c=>sinTilde(txt(c).toUpperCase()));
      const ix=k=>H.findIndex(h=>h.includes(k));
      const iP=Math.max(0,ix("PRINCIPAL")),iS=ix("SECUNDARIO"),iQ=ix("QUIEN"),iD=ix("DESARROLLO"),iC=ix("COMPROMISO");
      let prin="";
      for(const r of t.slice(1)){
        const util=c=>(c?.ps||[]).filter(p=>!/^(ficha de seguimiento|seguimiento proyecto)/i.test(p.t));
        const pc=r[iP];const p0=pc&&!pc.cont?util(pc).map(p=>p.t).join(" ").replace(/\s*\/\s*/g,"/").trim():"";if(p0)prin=p0;

  if(b.id==="aArch"){const l=viejasAire(a),prev=l.map(t=>[t,t.estado,t.cierre]);l.forEach(t=>cumplir(t,a.fecha,"Archivado: no se mencionaba desde el "+fechaCorta(ultMencion(t)),true,"archivada"));save();RF=null;renderActas();
    toast(`${l.length} compromisos archivados`,"Deshacer",()=>{prev.forEach(([t,e,c])=>{t.estado=e;t.cierre=c});save();RF=null;renderActas()});return}
  if(b.id==="aDel"){const i=S.actas.indexOf(a);S.actas.splice(i,1);save();renderActas();toast("Se eliminó el acta","Deshacer",()=>{S.actas.splice(i,0,a);save();renderActas()});return}
  const t=tareaDe(b),ac=b.dataset.ta;if(!t||!ac)return;
  if(ac==="hecho"){if(t.cierre&&t.cierre.f===a.fecha){reabrir(t);t.reabierta=true}else{cumplir(t,a.fecha,"",true);t.reabierta=false}}

  else if(ac==="cal"){const ev=S.eventos.find(x=>x.id===t.eventoId);if(ev){irA(pf(ev.fecha));setVista("dia")}return}
  save();renderActas();
}

async function transcribirAudio(file){
  if(!S.cfg.key)throw new Error("Pega tu clave en Ajustes IA");
  if(S.cfg.prov!=="groq")throw new Error("Para pasar audio a texto elige Groq en Ajustes IA");
  if(file.size>25e6)throw new Error("El archivo pesa más de 25 MB. Usa la transcripción que guarda Google Meet o un audio más corto");
  const fd=new FormData();fd.append("file",file);fd.append("model","whisper-large-v3-turbo");fd.append("language","es");fd.append("response_format","text");
  let r;try{r=await fetch("https://api.groq.com/openai/v1/audio/transcriptions",{method:"POST",headers:{Authorization:"Bearer "+S.cfg.key},body:fd})}catch(e){throw new Error("No se pudo conectar con Groq")}
  if(!r.ok){let m="Error "+r.status;try{const j=await r.json();m+=": "+(j.error?.message||"")}catch(e){}throw new Error(m.slice(0,200))}
  return(await r.text()).trim();
}

async function analizarReunion(a,abiertas,txt){
  const temas=[...new Set(S.tareas.map(t=>t.tema))].join(", ");
  const lista=abiertas.map(t=>`${t.id} | ${t.tema}${t.sub?" / "+t.sub:""} | ${t.texto.slice(0,140)}${t.resp?" | "+t.resp:""}`).join("\n");
  const sis=`Eres quien toma nota en la reunión técnica semanal del equipo de Altos del Cabo by Fondacio. La reunión es del ${fechaLarga(a.fecha)} de ${a.fecha.slice(0,4)}. Te doy los compromisos abiertos de actas anteriores (id | tema | texto | responsable) y el texto de la reunión. Responde SOLO un JSON con esta forma: {"cerrados":[{"id":"","nota":"qué se dijo"}],"avances":[{"id":"","nota":"qué se dijo"}],"nuevos":[{"tema":"","texto":"","responsable":"","fecha":"AAAA-MM-DD","ini":"HH:MM","fin":"HH:MM"}]}. "cerrados": compromisos que en la reunión se dijeron terminados. "avances": compromisos de los que se habló pero siguen abiertos. "nuevos": tareas o actividades nuevas que se acordaron. Usa solo ids de la lista. Para "tema" usa uno de estos cuando aplique: ${temas}. No inventes: si un dato no está claro, deja "". Las fechas relativas se cuentan desde el día de la reunión.`;
  const raw=await ia([{role:"user",content:`COMPROMISOS ABIERTOS:\n${lista}\n\nTEXTO DE LA REUNIÓN:\n${txt.slice(0,30000)}`}],sis);
  let j;try{j=JSON.parse(raw.match(/\{[\s\S]*\}/)[0])}catch(e){throw new Error("La IA no devolvió datos legibles. Intenta de nuevo")}
  const ids=new Set(abiertas.map(t=>t.id)),s=(v,n=300)=>typeof v==="string"?v.trim().slice(0,n):"";
  const okF=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")?v:"",okH=v=>/^\d{2}:\d{2}$/.test(v||"")?v:"";
  const uniq=arr=>{const v=new Set();return arr.filter(x=>!v.has(x.id)&&v.add(x.id))};
  const cerr=uniq((j.cerrados||[]).filter(x=>ids.has(x.id)).map(x=>({id:x.id,nota:s(x.nota)}))),cs=new Set(cerr.map(x=>x.id));
  return{cerrados:cerr,avances:uniq((j.avances||[]).filter(x=>ids.has(x.id)&&!cs.has(x.id)).map(x=>({id:x.id,nota:s(x.nota)}))),
    nuevos:(j.nuevos||[]).filter(x=>s(x.texto)).map(x=>({tema:s(x.tema,60),texto:s(x.texto),responsable:s(x.responsable,60),fecha:okF(x.fecha),ini:okH(x.ini),fin:okH(x.fin)}))};
}

  for(const tm of a.temas){const f=fila(tm.tema,tm.sub);if(tm.quien)f.quien.add(tm.quien);tm.avances.forEach(v=>f.des.push({t:v.t}))}
  for(const t of S.tareas){const e=enActa(t,a);if(!e||e.arch)continue;const f=fila(t.tema,t.sub);if(t.resp)f.quien.add(t.resp);
    if(e.cerradaAqui)f.des.push({t:t.texto,hecho:t.estado==="descartada"?"se decidió no hacerlo":t.estado==="archivada"?"archivado":"cumplido",nota:t.cierre.nota&&t.cierre.nota!==t.texto&&t.estado==="hecha"?t.cierre.nota:""});

  return[...filas.values()].filter(f=>f.des.length||f.comp.length);
}

/* ---------- Word de verdad (.docx): hoja horizontal, columnas de ancho fijo y viñetas que siguen al dar Enter ---------- */
function crc32(u){let c=-1;for(let i=0;i<u.length;i++){c^=u[i];for(let k=0;k<8;k++)c=c>>>1^(0xEDB88320&-(c&1))}return(c^-1)>>>0}
function zipArchivos(files,tipo){
  const en=new TextEncoder(),partes=[],cen=[];let off=0;
  for(const[nombre,txt]of files){const n=en.encode(nombre),d=en.encode(txt),c=crc32(d);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);
    partes.push(h,n,d);

document.querySelectorAll(".gh").forEach(b=>b.onclick=()=>{const o=b.getAttribute("aria-expanded")!=="true";b.setAttribute("aria-expanded",o);b.nextElementSibling.hidden=!o});
$("#side").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.eje){const o=new Set(S.ui.ocultos);t.checked?o.delete(t.dataset.eje):o.add(t.dataset.eje);S.ui.ocultos=[...o]}
  else return;
  save();renderCal()});
$("#bClr").onclick=()=>{S.chat=[];save();renderChat()};

function clicCal(e){
  if(vista==="actas"&&!popEl.contains(e.target))return clicActas(e);
  const t=e.target;
  const go=t.closest("[data-go]");if(go){cerrarPop();irA(pf(go.dataset.go));setVista("dia");return}
  const mo=t.closest("[data-more]");if(mo){popDia(mo.dataset.more,mo);return}
  const ev=t.closest("[data-ev]");if(ev){const x=S.eventos.find(y=>y.id===ev.dataset.ev);if(x)popEv(x,ev);return}
  if(!popEl.hidden){cerrarPop();return}
  if(Date.now()-popCerrado<400)return;
  if(t.classList.contains("col")){const m=Math.min(Math.floor(e.offsetY/HH*2)*30,23*60+30);formEvento(null,t.dataset.d,`${pad(Math.floor(m/60))}:${pad(m%60)}`);return}
  const mc=t.closest(".mc");if(mc)formEvento(null,mc.dataset.d);
}
$("#cv").onclick=clicCal;
popEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-pa]");if(b){const on=popEl._on;cerrarPop();if(b.dataset.pa!=="x"&&on)on(b.dataset.pa);return}
  if(e.target.closest("[data-go],[data-ev]"))clicCal(e);
});
/* deslizar a los lados en el teléfono para cambiar de mes, semana o día */
let toque=null;
$("#cv").addEventListener("touchstart",e=>{const p=e.touches[0];toque={x:p.clientX,y:p.clientY}},{passive:true});
$("#cv").addEventListener("touchend",e=>{if(!toque)return;const p=e.changedTouches[0],dx=p.clientX-toque.x,dy=p.clientY-toque.y;toque=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy))mover(dx<0?1:-1)});

let popCerrado=0;
document.addEventListener("mousedown",e=>{
  if(!menuEl.hidden&&!menuEl.contains(e.target)&&!(menuEl._a&&menuEl._a.contains(e.target)))cerrarMenu();
  if(!popEl.hidden&&!dlg.open&&!popEl.contains(e.target)&&!e.target.closest("[data-ev],[data-more]")){cerrarPop();popCerrado=Date.now()}
});
/* atajos de teclado como en Google Calendar */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!menuEl.hidden){cerrarMenu();return}if(!popEl.hidden){cerrarPop();return}if(document.body.classList.contains("drw")){quitarDrawer();return}}
  if(dlg.open||!$("#quien").hidden||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const k=e.key.toLowerCase(),V={d:"dia",w:"sem",m:"mes",a:"agenda",r:"actas"};
  if(V[k])setVista(V[k]);else if(k==="t"){irA(new Date());renderCal()}else if(k==="j"||k==="n")mover(1);else if(k==="k"||k==="p")mover(-1);else if(k==="c")formEvento();else return;
  e.preventDefault();
});
let rz=0;addEventListener("resize",()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{if(!movil())document.body.classList.remove("drw");aplicarUI()})});
setInterval(()=>{if(vista==="sem"||vista==="dia")renderCal()},60000);

$("#chatForm").onsubmit=e=>{e.preventDefault();enviar($("#chatIn").value)};
$("#msgs").onclick=e=>{
  const ap=e.target.dataset.ap,no=e.target.dataset.no;
  if(ap!=null){const m=S.chat[ap];aplicar(m.acc);m.hecho=true;save();renderChat()}
  if(no!=null){S.chat[no].hecho=true;save();renderChat()}};
$("#sug").innerHTML=["¿Qué hay esta semana?","¿Qué tengo hoy?","Crea una reunión de equipo el viernes a las 3 p. m."].map(t=>`<button type="button">${t}</button>`).join("");
$("#sug").onclick=e=>{if(e.target.tagName==="BUTTON")enviar(e.target.textContent)};

/* cerrar el diálogo solo al hacer clic fuera de él */
dlg.addEventListener("mousedown",e=>{if(e.target!==dlg)return;const r=dlg.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)cerrar()});

if(movil()||S.ui.panel!=="asis")S.ui.panel=null;
if(crearActaViernes())save();
if(!S.equipo){S.equipo=equipoInicial();save()}
if(S.ui.cal&&!EQ().some(n=>llave(n)===llave(S.ui.cal)))S.ui.cal="";
renderCals();aplicarUI();render();renderChat();
pantallaQuien();
</script>
</body>
</html>
