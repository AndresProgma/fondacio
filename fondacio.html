<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fondacio Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFD;--surface:#FFFFFF;--surface-2:#F0F4F9;--ink:#1F1F1F;--ink-2:#3C4043;--muted:#70757A;
  --line:#DADCE0;--outline:#747775;--hover:rgba(31,31,31,.08);--primary:#0B57D0;--on-primary:#FFFFFF;
  --tonal:#C2E7FF;--on-tonal:#001D35;--field:#F1F3F4;--now:#EA4335;--danger:#B3261E;
  --snack:#303030;--on-snack:#F2F2F2;--snack-act:#A8C7FA;--focus:#0B57D0;
  --shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --shadow-lg:0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12),0 11px 15px -7px rgba(0,0,0,.2);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131314;--surface:#1E1F20;--surface-2:#282A2C;--ink:#E3E3E3;--ink-2:#C4C7C5;--muted:#9AA0A6;
  --line:#3C4043;--outline:#8E918F;--hover:rgba(227,227,227,.08);--primary:#A8C7FA;--on-primary:#062E6F;
  --tonal:#004A77;--on-tonal:#C2E7FF;--field:#2D2F31;--now:#F28B82;--danger:#F2B8B5;
  --snack:#E3E3E3;--on-snack:#303030;--snack-act:#0B57D0;--focus:#A8C7FA;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.35);
  --shadow-lg:0 24px 38px 3px rgba(0,0,0,.5),0 9px 46px 8px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.43 Roboto,"Google Sans",system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.sp1{flex:1}

/* ---------- barra superior ---------- */
.bar{height:64px;display:flex;align-items:center;gap:2px;padding:8px 12px 8px 8px}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative;flex:none;padding:0}
.ib:hover{background:var(--hover)}
.ib.sm{width:28px;height:28px}.ib.sm svg{width:20px;height:20px}
.ib.on{background:var(--tonal);color:var(--on-tonal)}
.logo{display:flex;align-items:center;gap:10px;padding:0 4px;min-width:204px;margin-right:12px;flex:none;font-size:22px;color:var(--ink-2);white-space:nowrap}
.logo .mk{flex:none;width:40px;height:40px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:500;font-size:20px}
.logo b{font-weight:500;color:var(--ink)}
.ttl-h{font-size:22px;line-height:28px;color:var(--ink);margin:0 0 0 12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#D93025;color:#fff;font-size:10px;line-height:16px;font-weight:500;text-align:center}
.mob{display:none!important}

/* ---------- botones ---------- */
.btn{height:36px;padding:0 16px;border:1px solid var(--outline);border-radius:18px;background:none;color:var(--primary);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;letter-spacing:.01em}
.btn:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.pri:hover{background:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15)}
.btn.txt{border-color:transparent}
.btn.del{color:var(--danger)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.hoy{color:var(--ink);height:40px;padding:0 20px;margin:0 10px 0 2px;border-radius:20px}
.hoy:hover{background:var(--hover)}
.vbtn{color:var(--ink);height:40px;padding:0 10px 0 18px;border-radius:20px;margin-left:6px;gap:4px}
.vbtn:hover{background:var(--hover)}

/* ---------- estructura ---------- */
.app{display:flex;height:calc(100% - 64px)}
.side{width:256px;flex:none;overflow-y:auto;padding:8px 8px 16px 8px}
.app.nosid .side{display:none}
.cv{flex:1;min-width:0;background:var(--surface);border-radius:16px;margin:0 0 16px 0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.app.nosid .cv{margin-left:8px}
.sp{width:328px;flex:none;background:var(--surface);border-radius:16px;margin:0 0 16px 8px;display:flex;flex-direction:column;overflow:hidden}
.rail{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}

/* ---------- barra lateral ---------- */
.crear{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);cursor:pointer;margin:0 0 20px 0}
.crear:hover{box-shadow:var(--shadow);background:color-mix(in srgb,var(--surface) 92%,var(--primary))}
.crear>svg:first-child{color:var(--primary);width:28px;height:28px}
.crear>svg:last-child{width:20px;height:20px;color:var(--ink-2);margin-left:-4px}
.mini{padding:0 4px 0 8px;margin-bottom:12px}
.mh2{display:flex;align-items:center;justify-content:space-between;padding-left:8px;margin-bottom:2px;font-weight:500;color:var(--ink)}
.mgd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px}
.mgd .dl{color:var(--muted);font-weight:500;line-height:28px}
.mgd button{width:26px;height:26px;margin:1px auto;border:0;border-radius:50%;background:none;font-size:10px;font-weight:500;cursor:pointer;padding:0;color:var(--ink)}
.mgd button:hover{background:var(--hover)}
.mgd .out{color:var(--muted)}
.mgd .sel{background:var(--tonal);color:var(--on-tonal)}
.mgd .today{background:var(--primary);color:var(--on-primary)}
.mgd .today:hover{background:var(--primary)}
.grp{margin:2px 0}
.gh{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:0 6px 0 16px;height:40px;border-radius:20px;cursor:pointer;font-size:15px;font-weight:500;color:var(--ink);text-align:left}
.gh:hover{background:var(--hover)}
.gh svg{width:22px;height:22px;transition:transform .15s}
.gh[aria-expanded=true] svg{transform:rotate(180deg)}
.cb{display:flex;align-items:center;gap:16px;min-height:32px;margin:0;font-size:14px;font-weight:400;padding:4px 12px 4px 18px;border-radius:16px;cursor:pointer;color:var(--ink-2);position:relative;line-height:1.3}
.cb:hover{background:var(--hover)}
.cb input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.bx{width:18px;height:18px;border:2px solid var(--c);border-radius:2px;flex:none;display:grid;place-items:center}
.cb input:checked+.bx{background:var(--c)}
.cb input:checked+.bx::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.cb input:focus-visible+.bx{outline:2px solid var(--focus);outline-offset:2px}
.slink{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:0 16px;height:40px;border-radius:20px;cursor:pointer;color:var(--ink-2);margin-top:10px;text-align:left}
.slink:hover{background:var(--hover)}
.sync{margin:10px 8px 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.sync b{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
.sync .pt{width:8px;height:8px;border-radius:50%;background:var(--c,#9AA0A6);flex:none}
.sync p{margin:4px 0 8px;color:var(--muted)}
.sync .btn{height:30px;padding:0 12px;font-size:13px}
.slink svg{width:20px;height:20px}
.foot{font-size:12px;color:var(--muted);padding:8px 16px 0;margin:0}
/* ---------- equipo: quién eres y calendario de cada persona ---------- */
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c,#5F6368);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:500}
.av.gen{background:var(--primary);color:var(--on-primary)}
.yo{display:inline-flex;align-items:center;gap:8px;height:40px;border:1px solid var(--outline);border-radius:20px;background:none;padding:0 8px 0 6px;cursor:pointer;color:var(--ink);font:inherit;font-weight:500;margin-left:6px;max-width:220px}
.yo:hover{background:var(--hover)}
.yo span:not(.av){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yo svg{width:20px;height:20px;flex:none}
.pers{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:4px 12px 4px 14px;min-height:40px;border-radius:20px;cursor:pointer;color:var(--ink-2);text-align:left;font:inherit}
.pers:hover{background:var(--hover)}
.pers.on{background:var(--tonal);color:var(--on-tonal);font-weight:500}
.mis{margin:0 4px 10px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.mis h3{font-size:13px;font-weight:500;margin:0 0 6px;color:var(--ink)}
.mi{display:block;width:100%;border:0;background:none;text-align:left;padding:6px 4px;border-radius:8px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px;line-height:18px}
.mi:hover{background:var(--hover)}
.mi small{display:block;color:var(--muted);font-size:12px}
.mi small b{color:var(--primary);font-weight:500}
.quien{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.qbox{width:min(520px,100%);background:var(--surface);border-radius:24px;padding:28px 24px;box-shadow:var(--shadow);text-align:center}
.qbox h1{font-size:26px;font-weight:400;margin:14px 0 4px}
.qbox p{color:var(--ink-2);margin:0 0 18px}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.qp{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--line);background:none;border-radius:16px;padding:14px 8px;cursor:pointer;color:var(--ink);font:inherit;font-weight:500}
.qp:hover{background:var(--hover)}
.qp.ult{border-color:var(--primary)}
.qp .av{width:44px;height:44px;font-size:18px}
.qbox .mk{width:48px;height:48px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:inline-grid;place-items:center;font-size:24px;font-weight:500}
.qnew{display:flex;gap:8px;margin-bottom:12px}
.qnew input{flex:1}
.eqs{display:flex;flex-wrap:wrap;gap:6px}
.eqc{display:inline-flex;align-items:center;margin:0;cursor:pointer}
.eqc input{position:absolute;opacity:0;width:1px;height:1px}
.eqc span{border:1px solid var(--outline);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--ink-2)}
.eqc input:checked+span{background:var(--tonal);color:var(--on-tonal);border-color:transparent}
.eqc input:focus-visible+span{outline:2px solid var(--focus)}
.mviews{display:none;margin-bottom:12px}
.mviews button{display:flex;align-items:center;width:100%;border:0;background:none;height:44px;padding:0 20px;border-radius:22px;cursor:pointer;font-weight:500;color:var(--ink-2);text-align:left}
.mviews button.on{background:var(--tonal);color:var(--on-tonal)}

/* ---------- vista de mes ---------- */
.mg{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0}
.mc{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0 2px;min-height:0;overflow:hidden;text-align:center}
.mc:nth-child(7n){border-right:0}
.mc .dw{font-size:11px;font-weight:500;color:var(--muted);padding-top:4px;line-height:16px;letter-spacing:.8px;text-transform:uppercase}
.dn{min-width:24px;height:24px;padding:0 6px;border:0;border-radius:12px;background:none;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;margin:2px 0 2px}
.dn:hover{background:var(--hover)}
.mc.out .dn{color:var(--muted)}
.mc.today .dn{background:var(--primary);color:var(--on-primary)}
.evs{text-align:left}
.ch{display:flex;align-items:center;gap:6px;width:calc(100% - 8px);margin:0 4px 2px;height:20px;border:0;border-radius:4px;background:none;padding:0 4px;font-size:12px;line-height:20px;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-align:left}
.ch:hover{background:var(--hover)}
.ch i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.ch .ct{flex:none;color:var(--ink-2)}
.ch b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.more{display:block;width:calc(100% - 8px);margin:0 4px;height:20px;border:0;border-radius:4px;background:none;text-align:left;padding:0 6px;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer}
.more:hover{background:var(--hover)}

/* ---------- vistas de día y semana ---------- */
.tg{flex:1;overflow-y:auto;min-height:0;position:relative}
.th,.tbd{display:grid;grid-template-columns:64px repeat(var(--n),minmax(0,1fr))}
.th{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:8px}
.tz{font-size:10px;color:var(--muted);align-self:end;text-align:right;padding:0 8px 6px 0}
.thd{text-align:center;padding-bottom:8px}
.dw2{display:block;font-size:11px;font-weight:500;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;line-height:20px}
.dn2{width:46px;height:46px;border:0;border-radius:50%;background:none;font-size:26px;color:var(--ink-2);cursor:pointer;line-height:46px;padding:0}
.dn2:hover{background:var(--hover)}
.today>.dw2,.thd.today .dw2{color:var(--primary)}
.today .dn2{background:var(--primary);color:var(--on-primary)}
.gut{position:relative;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh)) no-repeat right top/8px 100%}
.gut span{position:absolute;right:12px;transform:translateY(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh))}
.te{position:absolute;border:1px solid var(--surface);border-radius:4px;background:var(--c);color:#fff;padding:1px 6px;font-size:12px;line-height:16px;text-align:left;overflow:hidden;cursor:pointer;display:block;z-index:1}
.te b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.te span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.te.one{white-space:nowrap;text-overflow:ellipsis}
.te.one b{display:inline}
.te:hover{box-shadow:var(--shadow);z-index:2}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--now)}

/* ---------- agenda ---------- */
.ag{flex:1;overflow:auto;padding:8px 0}
.agd{display:grid;grid-template-columns:132px 1fr;border-bottom:1px solid var(--line);padding:6px 8px 6px 0}
.agn{display:flex;align-items:center;gap:6px;padding-left:12px;height:44px}
.agn .dn2{width:40px;height:40px;font-size:22px;line-height:40px}
.agm{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.agd.today .agm{color:var(--primary)}
.agr{display:grid;grid-template-columns:20px 180px 1fr;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0 12px;min-height:44px;border-radius:4px;cursor:pointer;text-align:left;color:var(--ink)}
.agr:hover{background:var(--hover)}
.agr i{width:12px;height:12px;border-radius:50%;background:var(--c);justify-self:center}
.agr .at{color:var(--ink-2)}
.agr b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- tarjeta emergente y menús ---------- */
.pop{position:fixed;z-index:30;width:448px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;background:var(--surface-2);border-radius:24px;box-shadow:var(--shadow-lg);padding:8px 8px 20px}
.pop.narrow{width:232px;text-align:center;padding-bottom:12px}
.pop.sheet{left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;border-radius:28px 28px 0 0;max-height:82vh}
.ptb{display:flex;justify-content:flex-end;gap:2px;margin-bottom:2px}
.ptb .ib svg{width:20px;height:20px}
.prow{display:grid;grid-template-columns:52px 1fr;align-items:start;padding:5px 16px 5px 0;color:var(--ink-2);text-align:left;overflow-wrap:anywhere}
.prow>svg{width:20px;height:20px;justify-self:center}
.prow>.sq{justify-self:center;margin-top:7px}
.sq{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.ptt{font-size:22px;line-height:28px;color:var(--ink)}
.psub{color:var(--ink-2);margin-top:2px}
.pdh{margin:-28px 0 8px}
.pdh .dw{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.pdl{text-align:left}
.pdl .ch{width:100%;margin:0 0 2px}
.menu{position:fixed;z-index:35;background:var(--surface-2);border-radius:8px;box-shadow:var(--shadow);padding:8px 0;min-width:220px}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:24px;width:100%;border:0;background:none;padding:0 16px;height:40px;cursor:pointer;text-align:left;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:0}
.menu kbd{font:inherit;color:var(--muted)}

/* ---------- panel lateral (asistente) ---------- */
.sph{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 6px 20px}
.spt{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.sps{font-size:18px;color:var(--ink);line-height:24px}
.spb{flex:1;overflow:auto;padding:4px 12px 16px}
.hint{color:var(--muted);font-size:13px;margin:8px 4px 12px}
summary{cursor:pointer;color:var(--ink-2)}

/* chat */
.chat{display:flex;flex-direction:column;flex:1;min-height:0;padding:0 12px 12px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.m2{max-width:90%;padding:8px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.m2.u{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.m2.a{align-self:flex-start;background:var(--field);border-bottom-left-radius:4px}
.m2.s{align-self:center;color:var(--muted);font-size:13px;text-align:center}
.chat form{display:flex;gap:8px;margin-top:8px}
.chat input[type=text]{flex:1;min-width:0;border-radius:24px;padding:10px 16px}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sug button{font-size:12px;border:1px solid var(--outline);background:none;border-radius:8px;padding:4px 12px;cursor:pointer;color:var(--ink-2)}
.sug button:hover{background:var(--hover)}
.act{border:1px dashed var(--outline);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:13px}

/* ---------- formularios y diálogos ---------- */
input,select,textarea{background:var(--field);border:0;border-radius:4px;padding:8px 10px;width:100%;min-height:36px}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 -2px 0 var(--primary)}
input[type=checkbox]{width:auto;min-height:0}
label{display:block;font-size:12px;color:var(--ink-2);margin:12px 0 0;font-weight:500}
label>input,label>select,label>textarea{display:block;margin-top:4px;font-weight:400;font-size:14px;color:var(--ink)}
dialog{border:0;border-radius:28px;background:var(--surface);color:var(--ink);padding:20px 24px 24px;width:min(600px,94vw);max-height:92vh;box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{font-size:22px;font-weight:400;margin:0;line-height:28px}
dialog h3{font-size:14px;font-weight:500;margin:22px 0 2px;color:var(--ink)}
h3 small{font-weight:400;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}

.fr{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px;margin:8px 0}
.fr>svg{width:20px;height:20px;color:var(--ink-2);justify-self:center}
.fr.top{align-items:start}.fr.top>svg{margin-top:8px}
.dt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.dact{display:flex;gap:8px;align-items:center;margin-top:22px}
.toast{position:fixed;left:24px;bottom:24px;max-width:calc(100vw - 48px);background:var(--snack);color:var(--on-snack);padding:6px 8px 6px 16px;border-radius:4px;min-height:48px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);z-index:50;transform:translateY(16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;background:none;color:var(--snack-act);font-weight:500;cursor:pointer;padding:8px;border-radius:4px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:38}


/* ---------- actas ---------- */
.actas{flex:1;display:flex;min-height:0}
.al{width:250px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:12px 8px}

.ali.on{background:var(--tonal);color:var(--on-tonal)}
.ali b{display:block;font-weight:500}
.ali span{font-size:12px;color:var(--muted)}
.ali.on span{color:inherit;opacity:.8}
.ad{flex:1;min-width:0;overflow:auto;padding:16px 24px 40px}
.ah{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}

.ah .btn svg,.alh .btn svg,.vacio .btn svg{width:18px;height:18px}
.ameta{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 4px}
.ameta label{margin:4px 0 0;flex:1 1 200px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.fchip{height:32px;border:1px solid var(--outline);border-radius:8px;background:none;padding:0 12px;cursor:pointer;color:var(--ink-2);font-size:13px}
.fchip b{font-weight:500;margin-left:4px}
.fchip.on{background:var(--tonal);color:var(--on-tonal);border-color:transparent}
.fchip.warnc:not(.on){border-color:#E37400;color:#B06000}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:16px 0 6px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink);font:inherit}
.card:hover{background:var(--hover)}
.card b{font-size:28px;font-weight:400;line-height:34px}
.card span{font-weight:500;font-size:14px}
.card small{font-size:12px;color:var(--muted);line-height:16px}
.card.warn b{color:#B06000}
.card.ok b{color:#188038}
.card.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.guia ol{margin:8px 0 0;padding-left:22px;line-height:1.6}
.guia-txt{max-height:55vh;overflow:auto;line-height:1.55}

.guia summary,.box summary{cursor:pointer;font-weight:500}
.tbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 0}
.tg2{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.tg2>summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 16px;cursor:pointer;user-select:none}
.tg2>summary::-webkit-details-marker{display:none}
.tg2>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.tg2[open]>summary::before{transform:rotate(45deg)}
.tg2>summary:hover{background:var(--hover)}
.tn{font-size:16px;font-weight:500;color:var(--ink)}
.tc{font-size:13px;color:var(--muted)}
.tc .ca{color:#B06000;font-weight:500}
.tg2[open]>summary{border-bottom:1px solid var(--line)}
.th3{font-weight:500;color:var(--ink-2);margin:0;padding:12px 16px 2px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.avs{font-size:13px;color:var(--ink-2);margin:0;padding:4px 16px 6px}
.avs b{font-weight:500}
.tr{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.th3+.tr,.avs+.tr,summary+.tr{border-top:0}
.tr.aire{box-shadow:inset 4px 0 0 #F9AB00}

.tt{color:var(--ink);font-size:15px;line-height:22px;overflow-wrap:anywhere}
.tm{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}

.tag.ok{background:#E6F4EA;color:#0D652D}

.tacts{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px}
.btn.ok{color:#188038;border-color:#188038}

.warn2{color:var(--danger);font-weight:500}
.aviso{background:#FEEFC3;color:#7A4A00;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.imp{display:flex;gap:12px;align-items:flex-start;margin:0 0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px;font-weight:400;color:var(--ink)}

.msg{white-space:pre-wrap;background:var(--field);border-radius:8px;padding:8px 10px;margin:6px 0 0;color:var(--ink-2);font-size:13px;text-align:left;max-height:300px;overflow:auto}
.allday{display:flex;flex-direction:column;gap:2px;padding:4px 4px 0;text-align:left}

.grab{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);background:var(--snack);color:var(--on-snack);border-radius:24px;padding:6px 8px 6px 16px;box-shadow:var(--shadow);font-size:14px}

@keyframes lat{50%{opacity:.25}}
.grab button{border:0;background:none;color:var(--snack-act);font:inherit;font-weight:500;padding:6px 10px;border-radius:16px;cursor:pointer}
.grab button:hover{background:rgba(127,127,127,.2)}
.grab .stop{background:#EA4335;color:#fff}.grab .stop:hover{background:#C5221F}
.gpaso{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.gpaso ol{margin:6px 0 10px;padding-left:20px;font-size:14px}.gpaso li{margin:3px 0}
.falt{border-left:4px solid #F9AB00}
.fi{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.fi p{margin:0 0 2px;font-size:14px}.fi small{color:var(--muted);font-size:12px}
@media(max-width:800px){.fi{grid-template-columns:1fr}}
.tab{height:100%;overflow:auto;padding:16px 24px 32px;background:var(--surface);border-radius:16px}
.tpers{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tpers button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:4px 14px 4px 4px;background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.tpers button:hover{background:var(--hover)}
.tpers button.on{background:var(--tonal);color:var(--on-tonal);border-color:transparent}
.tpers .av{width:26px;height:26px;font-size:12px}.tpers .av svg{width:16px;height:16px}
.tabh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}.tabh h2{font-size:20px;font-weight:400;margin:0;flex:1;min-width:200px}
.tab .hint{margin:0 0 14px}
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.kc{background:var(--surface-2);border-radius:12px;padding:10px;min-height:140px;border-top:4px solid var(--kc)}
.kc.hacer{--kc:#9AA0A6}.kc.haciendo{--kc:#1A73E8}.kc.hecho{--kc:#188038}
.kc.drop{outline:2px dashed var(--primary);outline-offset:-2px}
.kc h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;margin:4px 4px 2px}
.kc h3 span{margin-left:auto;font-size:13px;color:var(--muted);font-weight:400}
.kc>p{font-size:12px;color:var(--muted);margin:0 4px 10px}
.kt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.kt.arr{opacity:.4}
.kt p{margin:0 0 4px;font-size:14px;line-height:1.4;color:var(--ink)}
.kt.hecho p{color:var(--ink-2)}
.kt small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.ka{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.ka .btn.sm{height:30px;padding:0 10px}
.kvac{font-size:13px;color:var(--muted);text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:10px}
.kres{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.kp{display:block;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.kp:hover{background:var(--hover)}
.kp .who{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;margin-bottom:12px}
.kn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.kn b{display:block;font-size:22px;font-weight:400}.kn span{font-size:12px;color:var(--muted)}
.kbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:12px}
.kbar i{display:block}
.kp ul{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}.kp li{margin:2px 0}
@media(max-width:800px){.tab{padding:12px;border-radius:0}.kb{grid-template-columns:1fr}.kc.haciendo{order:-1}}
@media(max-width:800px){.actas{flex-direction:column}.al{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:30vh}.ad{padding:12px}.tr{grid-template-columns:1fr}.tacts{justify-content:flex-start}.cards{grid-template-columns:repeat(2,1fr)}}

/* ---------- teléfono ---------- */
@media(max-width:800px){
  .bar{padding:8px 4px}
  .logo,.dsk,.vbtn,.rail{display:none!important}
  .yo{border:0;padding:0 4px;margin:0}.yo span:not(.av),.yo svg{display:none}
  .mob{display:inline-grid!important}
  .ttl-h{font-size:18px;margin-left:4px}

  .side{position:fixed;inset:0 auto 0 0;z-index:40;width:288px;max-width:85vw;background:var(--surface);transform:translateX(-100%);transition:transform .2s;padding-top:16px;box-shadow:var(--shadow-lg);visibility:hidden}
  body.drw .side{transform:none;visibility:visible}
  .app.nosid .side{display:block}
  .cv,.app.nosid .cv{margin:0 4px 4px}
  .sp{position:fixed;inset:0 0 0 auto;z-index:40;width:min(400px,100%);margin:0;border-radius:0}
  .mviews{display:block}
  .two{grid-template-columns:1fr}
  .toast{left:12px;right:12px;bottom:12px;max-width:none}
  .mc .dw{font-size:10px;letter-spacing:0}
  .ch{gap:3px;padding:0 2px;margin:0 2px 2px;width:calc(100% - 4px)}
  .ch .ct{display:none}
  .th,.tbd{grid-template-columns:44px repeat(var(--n),minmax(0,1fr))}
  .gut span{right:6px;font-size:9px}
  .dn2{width:34px;height:34px;font-size:18px;line-height:34px}
  .te{padding:1px 3px;font-size:11px}
  .agd{grid-template-columns:76px 1fr}
  .agn{flex-direction:column;gap:0;height:auto;padding-left:8px}

  dialog{padding:16px 16px 20px}
}
</style>
</head>

<script>
"use strict";
const $=s=>document.querySelector(s);
const EJES={form:"Formación",com:"Comunidad",eco:"Economía circular",eq:"Equipo"};
const KEY="fondacio_v3";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const pf=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const hora=h=>{if(!h)return"";let[a,b]=h.split(":").map(Number);const p=a>=12?"p. m.":"a. m.";a=a%12||12;return`${a}:${pad(b)} ${p}`};
const fechaLarga=s=>{const d=pf(s);return`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`};
const ord=(a,b)=>(a.fecha+a.ini).localeCompare(b.fecha+b.ini);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mins=h=>{const[a,b]=h.split(":").map(Number);return a*60+b};

/* Reparte en columnas los eventos que se cruzan, como Google Calendar */
function columnas(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);
  const grupos=[];let g=[],fin=-1;
  for(const it of items){if(g.length&&it.s>=fin){grupos.push(g);g=[]}g.push(it);fin=Math.max(fin,it.e)}
  if(g.length)grupos.push(g);
  for(const gr of grupos){const cols=[];for(const it of gr){let c=cols.findIndex(t=>t<=it.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=it.e;it.c=c}gr.forEach(it=>it.n=cols.length)}
}

    let x=r.right+8;if(x+w>innerWidth-8)x=r.left-w-8;if(x<8)x=Math.max(8,Math.min(innerWidth-w-8,r.left));

async function ia(msgs,sistema){
  if(!S.cfg.key)throw new Error("Falta la clave en Ajustes IA");
  let r;
  const P=PROV[S.cfg.prov]||PROV.groq;
  try{r=await fetch(P.url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+S.cfg.key},
    body:JSON.stringify({model:S.cfg.model||P.model,messages:[{role:"system",content:sistema||contexto()},...msgs],temperature:.3})})}
  catch(e){throw new Error("No se pudo conectar con "+P.n.split(" (")[0]+" (¿internet o bloqueo del navegador?)")}
  if(!r.ok){let m="Error "+r.status;try{const j=await r.json();m+=": "+(j.error?.message||j.error||"")}catch(e){}throw new Error(m.slice(0,200))}
  const j=await r.json();return j.choices?.[0]?.message?.content?.trim()||"(sin respuesta)";
}
function acciones(txt){
  const m=txt.match(/```json\s*([\s\S]*?)```/);if(!m)return{texto:txt,acc:null};
  let acc=null;try{acc=JSON.parse(m[1]).acciones}catch(e){}
  return{texto:txt.replace(m[0],"").trim(),acc:Array.isArray(acc)&&acc.length?acc:null};
}

async function enviar(txt){

/* ---------- 1. leer el .docx (es un zip) sin librerías ---------- */
async function leerDocx(file){
  const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer),dec=new TextDecoder();
  let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("no parece un archivo de Word (.docx)");
  let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true);
  for(let i=0;i<n;i++){
    const met=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    if(dec.decode(buf.subarray(p+46,p+46+nl))==="word/document.xml"){
      const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),data=buf.subarray(st,st+cs);
      if(met===0)return dec.decode(data);
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    }
    p+=46+nl+xl+cl;
  }
  throw new Error("el archivo no tiene el contenido de Word esperado");
}
const WNS="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
function parseActa(xml,nombre){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const q=(el,tag)=>[...el.getElementsByTagNameNS(WNS,tag)];
  const hijos=(el,tag)=>[...el.children].filter(c=>c.localName===tag);
  const val=(el,tag,at="val")=>{const x=q(el,tag)[0];return x?x.getAttributeNS(WNS,at)||"":""};
  const pars=tc=>q(tc,"p").map(p=>{
    const t=q(p,"t").map(x=>x.textContent).join("").replace(/\s+/g," ").trim();if(!t)return null;
    let azul=false,pend=false,tach=false,arr=false,resp="",tt=t,bul=q(p,"numPr").length>0;
    q(p,"r").forEach(r=>{const c=val(r,"color").toLowerCase(),h=val(r,"highlight"),s=val(r,"shd","fill").toLowerCase(),k=q(r,"strike")[0];
      if(c==="0000ff")azul=true;if((h&&h!=="none")||/^(ffff00|fff2cc|ff00ff)$/.test(s))pend=true;
      if(k&&!/^(0|false)$/.test(k.getAttributeNS(WNS,"val")||"")&&q(r,"t").some(x=>x.textContent.trim()))tach=true});
    const mb=tt.match(/^[•·▪◦●○■\-–]\s*/);if(mb){bul=true;tt=tt.slice(mb[0].length)}
    tt=tt.replace(/\s*✔\s*(cumplido|archivado|se decidi[oó] no hacerlo)\b.*$/i,()=>{tach=true;return""});
    tt=tt.replace(/\s*\((nuevo|desde el [^()]*|nadie lo menciona desde[^()]*)\)\s*$/i,(m,g)=>{if(!/^nuevo/i.test(g))arr=true;return""});
    tt=tt.replace(/\s+—\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s*\/\s*[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?)$/,(m,g)=>{resp=g;return""}).trim();
    if(!tt)return null;
    if(tach&&!/^(ya\s|no se)/i.test(tt))tt="Ya se hizo: "+tt;
    return{t:tt,bul,azul,pend,arr,resp}}).filter(Boolean);
  const body=q(doc,"body")[0];if(!body)throw new Error("documento vacío");
  const tablas=hijos(body,"tbl").map(t=>hijos(t,"tr").map(tr=>hijos(tr,"tc").map(tc=>({ps:pars(tc),cont:val(tc,"vMerge")===""&&q(tc,"vMerge").length>0}))));
  const txt=c=>c?c.ps.map(p=>p.t).join(" "):"";
  const a={id:uid(),archivo:nombre,fecha:"",modera:"",apunta:"",part:[],temas:[]};
  for(const t of tablas){
    const cab=sinTilde(t[0]?.map(txt).join(" ").toUpperCase()||"");
    if(t.some(r=>/^FECHA/.test(sinTilde(txt(r[0]).toUpperCase())))){
      for(const r of t){const k=sinTilde(txt(r[0]).toUpperCase()),v=txt(r[1]);
        if(k.startsWith("FECHA"))a.fecha=leerFecha(v)||"";else if(k.includes("MODERA"))a.modera=v;else if(k.includes("APUNTA"))a.apunta=v}
    }else if(cab.includes("PARTICIPANTES")){
      for(const r of t.slice(1)){const nm=txt(r[0]);if(!nm)continue;a.part.push({n:cap(nm.toLowerCase()),logros:(r[1]?.ps||[]).map(p=>p.t),mejorar:(r[2]?.ps||[]).map(p=>p.t)})}
    }else if(cab.includes("TEMA")&&cab.includes("COMPROMISO")){
      const H=t[0].map(c=>sinTilde(txt(c).toUpperCase()));
      const ix=k=>H.findIndex(h=>h.includes(k));
      const iP=Math.max(0,ix("PRINCIPAL")),iS=ix("SECUNDARIO"),iQ=ix("QUIEN"),iD=ix("DESARROLLO"),iC=ix("COMPROMISO");
      let prin="";
      for(const r of t.slice(1)){
        const util=c=>(c?.ps||[]).filter(p=>!/^(ficha de seguimiento|seguimiento proyecto)/i.test(p.t));
        const pc=r[iP];const p0=pc&&!pc.cont?util(pc).map(p=>p.t).join(" ").replace(/\s*\/\s*/g,"/").trim():"";if(p0)prin=p0;
        if(/^ejemplo/i.test(prin))continue;
        const sc=util(r[iS]);let sub=sc[0]?.t||"",k0=1;while(/\/$/.test(sub)&&sc[k0])sub+=" "+sc[k0++].t;
        const tema={tema:cap((prin||"Otros").toLowerCase()),sub:sub?cap(sub.toLowerCase()):"",quien:txt(r[iQ]),extra:sc.slice(k0).map(p=>p.t),avances:(r[iD]?.ps||[]).map(p=>({t:p.t,azul:p.azul,pend:p.pend})),items:[]};
        tema.tk=normTema(tema.tema)+"|"+normTema(tema.sub);
        let grupo="";
        for(const p of r[iC]?.ps||[]){
          if(!p.bul&&(/:$/.test(p.t)||/^pendientes futuros$/i.test(p.t))){grupo=p.t.replace(/:$/,"");continue}
          if(!p.bul&&tema.items.length&&p.t.split(" ").length<9){tema.items[tema.items.length-1].t+=" · "+p.t;continue}
          tema.items.push({t:p.t,azul:p.azul,pend:p.pend,grupo,arr:p.arr,resp:p.resp});
        }
        if(tema.items.length||tema.avances.length||tema.extra.length)a.temas.push(tema);
      }
    }
  }
  if(!a.fecha){const m=nombre.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)a.fecha=`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`}
  if(!a.fecha)throw new Error("no encontré la fecha del acta");
  if(!a.temas.length)throw new Error("no encontré la tabla de temas y compromisos");
  return a;
}
function leerFecha(s){const m=sinTilde(s.toLowerCase()).match(/(\d{1,2})\s+de\s+([a-z]+)\s+(?:de(?:l)?\s+)?(\d{4})/);if(!m)return"";const mi=MESN.indexOf(m[2]);return mi<0?"":`${m[3]}-${pad(mi+1)}-${pad(+m[1])}`}

/* ---------- 2. seguir los compromisos de acta en acta ---------- */
const esCierre=s=>{const x=sinTilde(s.toLowerCase()).trim();
  return /^(ya\s|listo|hecho|no se (hara|va a hacer)\b|se (cancelo|descarto)\b|se\s+(realizo|hizo|entrego|envio|termino|concluyo|firmo|compro|compraron|sembro|sembraron|subio|hicieron|realizaron|entregaron|enviaron|logro|organizo|lavaron)\b)|ya (esta|se) |quedo (listo|hecho)|esta subido/.test(x)&&!/pendiente|falta|todavia no|aun no|no se ha(n)?\b/.test(x)};
const estadoCierre=s=>/^(no se|se cancel|se descart)/.test(sinTilde(s.toLowerCase()).trim())?"descartada":"hecha";
function parecido(A,B){if(!A.size||!B.size)return{s:0,n:0};let n=0;A.forEach(w=>{if(B.has(w))n++});return{s:n/Math.min(A.size,B.size),n}}
function mejor(cands,tk,texto,u=.6){
  const A=fichas(texto);let best=null,bs=0;
  for(const t of cands){const mismo=t.tk===tk,{s,n}=parecido(A,fichas(t.texto));
    const ok=mismo?(n>=Math.min(2,A.size)&&s>=u):(n>=4&&s>=.85);
    if(ok&&s>bs){bs=s;best=t}}
  return best;
}
function nombresEquipo(){const s=new Set();S.actas.forEach(a=>{a.part.forEach(p=>p.n.split(/\s+y\s+|\//).forEach(x=>s.add(x.trim())));a.temas.forEach(t=>(t.quien||"").split(/\s*(?:\/|,|\by\b)\s*/).forEach(x=>x.trim().length>2&&s.add(cap(x.trim().toLowerCase()))))});return[...s].filter(Boolean)}
function respDe(texto,quien,nombres){
  const x=sinTilde(texto.toLowerCase());
  let best="",bi=1e9;for(const n of nombres){const m=x.search(new RegExp("\\b"+sinTilde(n.toLowerCase())+"\\b"));if(m>=0&&m<bi){bi=m;best=cap(n)}}if(best)return best;
  return(quien||"").split(/\s*(?:\/|,|\by\b)\s*/)[0]?.trim()?cap(quien.split(/\s*(?:\/|,|\by\b)\s*/)[0].trim().toLowerCase()):"";
}
function cumplir(t,f,nota,manual,estado="hecha"){t.estado=estado;t.cierre={f,nota:nota||"",manual:!!manual}}
function reabrir(t){t.estado="abierta";t.cierre=null}
function integrar(a,nombres){
  const usados=new Set();
  const abiertas=()=>S.tareas.filter(t=>t.estado==="abierta"&&t.desde<a.fecha&&!usados.has(t.id));
  for(const tm of a.temas){
    tm.avAuto=[];
    for(const it of tm.items){
      const m=mejor(abiertas(),tm.tk,it.t);
      if(m){usados.add(m.id);if(!it.arr){m.menciones.push({f:a.fecha,t:it.t});m.texto=it.t}if(it.resp)m.resp=it.resp;if(it.pend)m.marcada=a.fecha;if(esCierre(it.t))cumplir(m,a.fecha,it.t,false,estadoCierre(it.t))}
      else if(esCierre(it.t))tm.avAuto.push(it.t);
      else S.tareas.push({id:uid(),tk:tm.tk,tema:tm.tema,sub:tm.sub,texto:it.t,orig:it.t,resp:it.resp||respDe(it.t,tm.quien,nombres),desde:a.fecha,
        menciones:[{f:a.fecha,t:it.t}],estado:"abierta",cierre:null,grupo:it.grupo||"",marcada:it.pend?a.fecha:""});
    }
    for(const av of tm.avances)if(esCierre(av.t)){
      const m=mejor(S.tareas.filter(t=>t.estado==="abierta"&&t.desde<a.fecha),tm.tk,av.t);
      if(m){if(!usados.has(m.id)){usados.add(m.id);m.menciones.push({f:a.fecha,t:av.t})}cumplir(m,a.fecha,av.t,false,estadoCierre(av.t))}
    }
  }
}
/* Recalcula todo desde las actas importadas, conservando lo que el equipo cambió a mano */
function reconstruir(){
  const viejas=S.tareas,nombres=nombresEquipo();S.tareas=[];
  for(const a of actasOrden())if(!a.auto)integrar(a,nombres);
  const por=new Map(viejas.filter(v=>!v.manual).map(v=>[v.tk+"|"+v.orig,v]));
  for(const t of S.tareas){const v=por.get(t.tk+"|"+t.orig);if(!v)continue;
    t.id=v.id;if(v.eventoId)t.eventoId=v.eventoId;
    v.menciones.filter(m=>m.manual).forEach(m=>{if(!t.menciones.some(x=>x.f===m.f))t.menciones.push(m)});
    if(v.cierre&&v.cierre.manual){t.estado=v.estado;t.cierre=v.cierre}
    if(v.reabierta){t.estado="abierta";t.cierre=null;t.reabierta=true}
    if(v.haciendo)t.haciendo=v.haciendo;
    if(v.editado)["texto","resp","tema","sub","tk","editado"].forEach(k=>t[k]=v[k]);
  }
  viejas.filter(v=>v.manual).forEach(v=>S.tareas.push(v));
  [...(S.uniones||[])].sort((x,y)=>x.f.localeCompare(y.f)).forEach(aplicarUnion);
  S.tareas.forEach(t=>t.menciones.sort((x,y)=>x.f.localeCompare(y.f)));
}
/* ---------- 2b. la IA revisa qué compromisos son el mismo aunque los hayan escrito distinto ----------
   La comparación de palabras no reconoce «Ordenar el material de lectura» = «Organizar cartillas».
   La IA propone parejas, una persona las confirma, y la unión se guarda para que sobreviva al volver a cargar actas. */
const ordenM=t=>t.menciones.sort((x,y)=>x.f.localeCompare(y.f));
function candidatosUnion(a){
  const f=a.fecha,lim=iso(new Date(pf(f)-150*864e5));
  const nuevas=S.tareas.filter(t=>t.desde===f&&!t.manual);
  const viejas=S.tareas.filter(t=>t.desde<f&&t.estado!=="archivada"&&(!t.cierre||t.cierre.f>f)&&ultMencionHasta(t,f)<f&&ultMencionHasta(t,f)>=lim);
  const cierres=a.temas.flatMap(tm=>(tm.avAuto||[]).map(t=>({t,tema:tm.tema})));
  return{nuevas,viejas,cierres};
}
/* se manda por tema y en lotes pequeños, para no pasar el límite gratuito de la IA */
function lotesUnion(c){
  const g=new Map(),add=(k,tipo,x)=>{k=normTema(k);if(!g.has(k))g.set(k,{n:[],v:[],c:[]});g.get(k)[tipo].push(x)};
  c.nuevas.forEach(t=>add(t.tema,"n",t));c.viejas.forEach(t=>add(t.tema,"v",t));c.cierres.forEach(x=>add(x.tema,"c",x));
  const lotes=[];let cur=null,tam=0;
  for(const x of g.values()){if(!x.v.length||(!x.n.length&&!x.c.length))continue;
    const s=[...x.n,...x.v].reduce((m,t)=>m+Math.min(t.texto.length,140)+30,0)+x.c.reduce((m,y)=>m+Math.min(y.t.length,140)+30,0);
    if(!cur||tam+s>9000){cur={n:[],v:[],c:[]};lotes.push(cur);tam=0}cur.n.push(...x.n);cur.v.push(...x.v);cur.c.push(...x.c);tam+=s}
  return lotes;
}
async function unirIA(a,l){
  const cor=s=>String(s).replace(/\s+/g," ").slice(0,140),tm=t=>t.tema+(t.sub?" / "+t.sub:"");
  const txt=`COMPROMISOS QUE YA VENÍAN DE ACTAS ANTERIORES:\n${l.v.map((t,i)=>`V${i+1} | ${tm(t)} | ${cor(t.texto)}`).join("\n")}\n\nCOMPROMISOS DEL ACTA DEL ${a.fecha} QUE PARECEN NUEVOS:\n${l.n.map((t,i)=>`N${i+1} | ${tm(t)} | ${cor(t.texto)}`).join("\n")||"(ninguno)"}\n\nFRASES DEL ACTA QUE DICEN QUE ALGO SE CUMPLIÓ:\n${l.c.map((x,i)=>`C${i+1} | ${x.tema} | ${cor(x.t)}`).join("\n")||"(ninguna)"}`;
  const sis=`Ayudas a seguir los compromisos de las actas semanales del equipo de una fundación. De una semana a otra, las personas reescriben el mismo compromiso con otras palabras. Di cuáles compromisos que parecen nuevos (N) son en realidad el mismo que uno que ya venía (V), y qué frases de cumplimiento (C) cierran un compromiso que ya venía (V). Empareja solo si es la misma tarea (misma acción sobre lo mismo), no si solo comparten el tema o la persona. Cada V se usa una sola vez. Responde SOLO un JSON: {"mismos":[{"n":"N1","v":"V3","seguro":true}],"cierres":[{"c":"C1","v":"V2","seguro":true}]}. Usa "seguro": false si tienes dudas. Si no hay, deja las listas vacías.`;
  const raw=await ia([{role:"user",content:txt}],sis);
  let j;try{j=JSON.parse(raw.match(/\{[\s\S]*\}/)[0])}catch(e){throw new Error("La IA no devolvió datos legibles. Intenta de nuevo")}
  const ix=(s,p,arr)=>{const m=String(s||"").trim().match(new RegExp("^"+p+"(\\d+)$","i"));return m?arr[+m[1]-1]||null:null};
  const usados=new Set(),out=[];
  for(const x of j.mismos||[]){const n=ix(x.n,"N",l.n),v=ix(x.v,"V",l.v);if(n&&v&&!usados.has(v.id)){usados.add(v.id);out.push({tipo:"mismo",f:a.fecha,n,v,seguro:x.seguro!==false})}}
  for(const x of j.cierres||[]){const c=ix(x.c,"C",l.c),v=ix(x.v,"V",l.v);if(c&&v&&!usados.has(v.id)){usados.add(v.id);out.push({tipo:"cierre",f:a.fecha,c,v,seguro:x.seguro!==false})}}
  return out;
}
/* une el compromiso n dentro de v: v se queda con todo el recorrido */
function unirTareas(v,n){
  n.menciones.forEach(m=>{if(!v.menciones.some(x=>x.f===m.f))v.menciones.push(m)});ordenM(v);
  v.texto=n.texto;if(n.resp)v.resp=n.resp;if(n.haciendo&&!v.haciendo)v.haciendo=n.haciendo;
  if(n.cierre&&!v.cierre){v.estado=n.estado;v.cierre=n.cierre}
  if(n.eventoId&&!v.eventoId){v.eventoId=n.eventoId;const ev=S.eventos.find(e=>e.id===n.eventoId);if(ev)ev.tareaId=v.id}
  S.tareas.splice(S.tareas.indexOf(n),1);
}
function aplicarUnion(u){
  const v=S.tareas.find(t=>t.id===u.vid);if(!v)return;
  if(u.tipo==="mismo"){const n=S.tareas.find(t=>t.desde===u.f&&t.tk+"|"+t.orig===u.nk);if(n&&n!==v)unirTareas(v,n)}
  else{if(!v.menciones.some(m=>m.f===u.f)){v.menciones.push({f:u.f,t:u.ctxt});ordenM(v)}if(!v.cierre||v.cierre.f>u.f)cumplir(v,u.f,u.ctxt,false,estadoCierre(u.ctxt))}
}
async function revisarIA(actas,luego){
  const reales=actas.filter(a=>!a.auto).sort((x,y)=>x.fecha.localeCompare(y.fecha)),sigue=()=>{if(luego)luego()};

  <p class="hint">Busca compromisos que se escribieron distinto de un acta a otra pero son el mismo, para que no queden como olvidados. Se envía el texto de los compromisos a ${esc(PROV[S.cfg.prov].n.split(" (")[0])}.</p>
  <div id="uia"><p class="hint" id="uiaE">Revisando…</p></div>
  <div class="row"><button type="button" class="btn txt" id="omit">Saltar</button><button class="btn pri" id="uiaOk" hidden>Unir los marcados</button></div></form>`);

  catch(e){if(!fuera){$("#uiaE").textContent="No se pudo revisar: "+e.message;$("#omit").textContent="Seguir"}return}
  if(fuera)return;
  if(!props.length){cerrar();toast("La IA no encontró compromisos repetidos");sigue();return}
  const caja=(p,i,h)=>`<label class="imp"><input type="checkbox" data-u="${i}" ${p.seguro?"checked":""}><div>${h}${p.seguro?"":`<div class="m warn2">La IA no está segura: revísalo</div>`}</div></label>`;
  const M=props.map((p,i)=>[p,i]).filter(([p])=>p.tipo==="mismo"),C=props.map((p,i)=>[p,i]).filter(([p])=>p.tipo==="cierre");
  $("#uia").innerHTML=`${M.length?`<h3>Son el mismo compromiso (${M.length})</h3>`+M.map(([p,i])=>caja(p,i,`<div class="m">Venía desde el ${esc(fechaCorta(p.v.desde))}:</div><b>${esc(p.v.texto)}</b><div class="m" style="margin-top:6px">En el acta del ${esc(fechaCorta(p.f))} lo escribieron así:</div><b>${esc(p.n.texto)}</b>`)).join(""):""}
    ${C.length?`<h3>Se cumplieron (${C.length})</h3>`+C.map(([p,i])=>caja(p,i,`<div class="m">En el acta del ${esc(fechaCorta(p.f))} dice:</div><b>${esc(p.c.t)}</b><div class="m" style="margin-top:6px">Eso cierra el compromiso que venía desde el ${esc(fechaCorta(p.v.desde))}:</div><b>${esc(p.v.texto)}</b>`)).join(""):""}`;
  $("#uiaOk").hidden=false;$("#omit").textContent="Ahora no";
  $("#fia").onsubmit=e=>{e.preventDefault();
    const nuevas=[...document.querySelectorAll("#fia [data-u]:checked")].map(c=>{const p=props[+c.dataset.u];

/* ---------- 6. lo de la reunión: transcripción de Meet, notas o audio → IA ---------- */
/* ---------- pasar voz a texto aquí mismo: gratis, sin clave y sin mandar el audio a internet ----------
   Usa Whisper (de OpenAI, libre) dentro de Chrome con transformers.js. La primera vez descarga el modelo
   (unos 250 MB) y Chrome lo guarda; después funciona sin volver a descargarlo. Corre en un "worker" para no trabar la página. */
const WHISPER={lib:"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js",modelo:"onnx-community/whisper-small",mb:250};
let MOTOR=null,COLA=Promise.resolve();
function puedeTranscribir(){return typeof Worker==="undefined"||typeof WebAssembly==="undefined"?"Este navegador no puede pasar voz a texto. Usa Google Chrome":""}
function motor(){
  if(MOTOR)return MOTOR;
  const code=`import {pipeline} from "${WHISPER.lib}";
let asr=null;const vistos={};
async function cargar(){if(asr)return asr;
  asr=await pipeline("automatic-speech-recognition","${WHISPER.modelo}",{dtype:"q8",progress_callback:p=>{
    if(p.status==="progress"&&p.total){vistos[p.file]=[p.loaded,p.total];let a=0,b=0;for(const [x,y] of Object.values(vistos)){a+=x;b+=y}postMessage({carga:a/b})}}});
  return asr}
onmessage=async e=>{const {id,audio}=e.data;
  try{const a=await cargar();postMessage({id,trabajando:true});
    const r=await a(audio,{language:"spanish",task:"transcribe",chunk_length_s:30,stride_length_s:5});
    postMessage({id,texto:String(r.text||"").trim()})}
  catch(err){postMessage({id,error:String(err&&err.message||err)})}};`;
  const w=new Worker(URL.createObjectURL(new Blob([code],{type:"text/javascript"})),{type:"module"}),esperan=new Map();
  w.onmessage=e=>{const d=e.data;if(d.carga!=null){esperan.forEach(x=>x.estado(`Descargando el programa que pasa voz a texto (solo la primera vez, unos ${WHISPER.mb} MB): ${Math.round(d.carga*100)} %`));return}
    const x=esperan.get(d.id);if(!x)return;if(d.trabajando){x.estado(x.msg);return}
    esperan.delete(d.id);if(d.texto!=null)d.texto=limpiarVoz(d.texto);d.error?x.no(new Error(/fetch|network|Failed/i.test(d.error)?"No se pudo descargar el programa que pasa voz a texto. Revisa el internet e intenta otra vez":"No se pudo pasar a texto: "+d.error.slice(0,140))):x.ok(d.texto)};
  w.onerror=e=>{esperan.forEach(x=>x.no(new Error("No se pudo abrir el programa que pasa voz a texto. Revisa el internet")));esperan.clear();MOTOR=null};
  MOTOR={w,esperan,n:0};return MOTOR;
}
/* en los silencios Whisper a veces "oye" frases de videos de YouTube: se borran */
const limpiarVoz=t=>t.replace(/[^.!?]*amara\.org[.!]?/gi,"").replace(/(subt[ií]tulos? (realizados? |hechos? )?por[^.]*|¡?suscr[ií]bete[^.!]*!?|gracias por ver( el v[ií]deo)?[^.]*|no olvides suscribirte[^.]*)[.!]?/gi,"").replace(/\s{2,}/g," ").trim();
/* texto de un pedazo de audio (Float32 a 16 kHz). Va en fila: un pedazo a la vez */
function vozATexto(audio,estado,msg){
  const run=()=>new Promise((ok,no)=>{const m=motor(),id=++m.n;m.esperan.set(id,{ok,no,estado,msg});estado(msg);m.w.postMessage({id,audio},[audio.buffer])});
  const p=COLA.then(run,run);COLA=p.catch(()=>{});return p;
}
async function aMono16k(blob){
  const ctx=new AudioContext({sampleRate:16000});let buf;
  try{buf=await ctx.decodeAudioData(await blob.arrayBuffer())}catch(e){throw new Error("No se pudo leer ese archivo de audio. Prueba con mp3, m4a o webm")}finally{ctx.close()}
  if(buf.numberOfChannels===1)return buf.getChannelData(0).slice();
  const n=buf.length,m=new Float32Array(n);for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)m[i]+=d[i]/buf.numberOfChannels}return m;
}
const PARTE_SEG=+new URLSearchParams(location.search).get("parte")||600;/* ?parte=20 solo para pruebas */
async function transcribirArchivo(file,estado){
  if(puedeTranscribir())throw new Error(puedeTranscribir());
  estado("Leyendo el audio…");const todo=await aMono16k(file),paso=PARTE_SEG*16000,n=Math.ceil(todo.length/paso),txt=[];
  for(let i=0;i<n;i++)txt.push(await vozATexto(todo.slice(i*paso,(i+1)*paso),estado,`Pasando el audio a texto${n>1?` (parte ${i+1} de ${n})`:""}… puede tardar unos minutos`));
  return txt.filter(Boolean).join("\n\n");
}

/* ---------- 6b. grabar la reunión de Meet desde la página ----------
   Chrome graba el sonido de la pestaña de Meet (lo que dicen los demás) más el micrófono de quien graba.
   Cada 10 minutos se cierra una parte y se manda a pasar a texto, así nada pesa más de lo que acepta Groq.
   Todo queda en este computador menos el audio que se manda a Groq para pasarlo a texto. */
let GR=null;
const mimeAudio=()=>["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>MediaRecorder.isTypeSupported(m))||"";
const reloj=ms=>{const t=Math.floor(ms/1000);return(t>=3600?Math.floor(t/3600)+":":"")+pad(Math.floor(t/60)%60)+":"+pad(t%60)};
function formGrabar(a){

  const no=puedeTranscribir();
  abrir(`<form id="fgr"><div class="row between"><h2>Grabar la reunión de Meet</h2>${X}</div>
  <div class="gpaso"><b>Así se hace</b><ol>

    <li>Chrome pregunta qué compartir: elige <b>Pestaña</b>, toca la pestaña de Meet y deja prendido <b>Compartir también el audio de la pestaña</b>.</li>
    <li>Vuelve a Meet. Arriba de esta página queda una barra roja que dice cuánto lleva.</li>
    <li>Al final toca <b>Terminar</b> en esa barra. La página pasa todo a texto y lo deja listo para el acta.</li></ol>
  <p class="hint" style="margin:0">Deja esta pestaña abierta mientras dura la reunión. No necesita cuenta de pago de Google.</p></div>
  ${no?`<p class="hint" style="color:var(--danger)">${esc(no)}.</p>`:`<p class="hint">El paso a texto es gratis y se hace en este computador: el audio no se manda a ninguna página. La primera vez Chrome descarga el programa (unos ${WHISPER.mb} MB).</p>`}
  <label class="imp" style="margin:0"><input type="checkbox" name="ok" required><div><b>Ya avisé a todos que la reunión se va a grabar</b><div class="m">El audio y el texto se quedan en este computador. Si se habla de niños, cuiden ese texto como cuidan las actas.</div></div></label>
  <div class="dact"><span class="sp1"></span><button class="btn pri">${I.mic}Empezar a grabar</button></div></form>`);

async function empezarGrabacion(a){
  let pant;

    $("#x").onclick=cerrar;$("#otra").onclick=()=>{cerrar();empezarGrabacion(a)};return}

function nuevaParte(g){
  const r=new MediaRecorder(g.stream,{mimeType:g.tipo,audioBitsPerSecond:32000}),trozos=[],p={n:g.partes.length+1,estado:"grabando",texto:""};

async function pasarPartes(g){

/* ---------- 6c. lo que se dijo en la reunión y tal vez faltó en el acta ----------
   Se compara la transcripción de la llamada con lo que quedó escrito en el acta. Sin IA (gratis, en este computador):
   se buscan frases con señales de compromiso, fecha, persona o decisión cuyas palabras casi no aparecen en el acta,
   o que sí aparecen pero sin la fecha o la persona que se dijo. Con IA (si hay clave) la revisión es más fina. */
const SENAL=/\b(vamos a|va a|van a|voy a|vas a|hay que|tenemos que|tiene que|tienen que|toca|quedamos|queda pendiente|pendiente|se (va|van) a|comprometo|compromiso|acordamos|acuerdo|decidimos|propongo|propuesta|importante|urgente|no (se nos )?olvid|recordar|entregar|enviar|mandar|llamar|hablar con|organizar|comprar|confirmar|programar|reunion|taller|visita|jornada|evento|fecha|plazo|hasta el|antes del?|para el|lunes|martes|miercoles|jueves|viernes|sabado|domingo|manana|semana|mes)\b/;
const MESR="enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre";
function datosClave(t){const x=sinTilde(t.toLowerCase()),out=[];
  for(const n of EQ())if(new RegExp("\\b"+sinTilde(n.toLowerCase())+"\\b").test(x))out.push(n);
  (x.match(new RegExp(`\\b(lunes|martes|miercoles|jueves|viernes|sabado|domingo)( \\d{1,2})?( de (${MESR}))?\\b|\\b\\d{1,2} de (${MESR})\\b|\\b\\d{1,2}(:\\d{2})? ?(am|pm|a\\. ?m|p\\. ?m|de la (manana|tarde|noche))\\b|\\$ ?\\d[\\d.]*|\\b\\d+ (mil|millones|personas|ninos|familias|kits|cartillas)\\b`,"g"))||[]).forEach(v=>out.push(v.trim()));
  return[...new Set(out)]}
function textosActa(a){
  const l=a.temas.flatMap(tm=>[...tm.items.map(i=>i.t),...tm.avances.map(v=>v.t),tm.quien||""]);
  a.part.forEach(p=>l.push(p.n,...p.logros,...p.mejorar));
  if(a.auto)S.tareas.forEach(t=>{const e=enActa(t,a);if(e&&!e.arch)l.push(t.texto,...t.menciones.filter(m=>m.f===a.fecha).map(m=>m.t))});
  return l.filter(Boolean);
}
const claveF=t=>normTema(t).slice(0,70);
const CACHEF=new Map();
function faltanLocal(a){
  const firma=a.id+"|"+(a.transcripcion||"").length+"|"+a.temas.length+"|"+S.tareas.length+"|"+EQ().length;if(CACHEF.has(firma))return CACHEF.get(firma);
  const items=textosActa(a).map(t=>({t,f:fichas(t),x:sinTilde(t.toLowerCase())}));
  let fr=(a.transcripcion||"").replace(/\s+/g," ").split(/(?<=[.!?])\s+(?=[¿¡A-ZÁÉÍÓÚÑ0-9])/);
  const unidas=[];for(const f of fr){if(unidas.length&&fichas(f).size<3)unidas[unidas.length-1]+=" "+f;else unidas.push(f)}
  const out=[],vistas=[];
  for(const frase of unidas){
    const F=fichas(frase),x=sinTilde(frase.toLowerCase());if(F.size<4||F.size>60)continue;
    const nom=fichas(EQ().join(" "));nom.forEach(w=>F.delete(w));/* los nombres no cuentan para decir que dos frases hablan de lo mismo */
    const dat=datosClave(frase),senal=SENAL.test(x);if(!senal&&!dat.length)continue;
    let mejorI=null,cov=0;for(const it of items){let n=0;F.forEach(w=>{if(it.f.has(w))n++});const c=n/F.size;if(c>cov){cov=c;mejorI=it}}
    let tipo="",falta=[];
    if(cov<.5)tipo="falta";
    else if(mejorI){/* está en el acta: se revisa si le falta la fecha, la hora o la cantidad que se dijo (el nombre suele ir en «Quien habla») */
      falta=dat.filter(d=>!EQ().includes(d)&&!mejorI.x.includes(sinTilde(d.toLowerCase())));if(falta.length)tipo="incompleto"}
    if(!tipo)continue;
    if(vistas.some(v=>{let n=0;F.forEach(w=>{if(v.has(w))n++});return n/F.size>.6}))continue;vistas.push(F);
    const puntos=(senal?2:0)+dat.length*2+(x.match(SENAL)||[]).length+(tipo==="incompleto"?1:0);
    out.push({texto:frase.trim(),tipo,en:tipo==="incompleto"?mejorI.t:"",falta,puntos,k:claveF(frase)});
  }
  const top=out.filter(o=>o.puntos>=3).sort((p,q)=>q.puntos-p.puntos).slice(0,30),ks=new Set(top.map(o=>o.k));
  const res=out.filter(o=>ks.has(o.k));CACHEF.set(firma,res);return res;
}

    ...a.part.map(p=>[T(p.n),L(p.logros,R),L(p.mejorar,R)])],true):"";

/* ---------- 9. compartir con todo el equipo: los datos viven en una carpeta de Google Drive de Fondacio ----------
   Un programa pequeño de Google (Apps Script, archivo servidor-drive.gs) guarda en la carpeta "Agenda Fondacio"
   un archivo por computador (agenda-datos-<pc>.json). La página lee los de los demás y junta los cambios:
   gana el cambio más reciente de cada actividad, acta o compromiso, y lo borrado se recuerda para que no vuelva.
   El equipo solo abre el link del equipo: página + #drive=<dirección del programa>. Nada que instalar. */
const SYNC_COL=["eventos","actas","tareas"],SYNC_UNO=["equipo","uniones","archivos"],EJEMPLOS=["Reunión de equipo","Jornada de clasificación de ropa","Feria de economía circular"];
const CODIGO_DRIVE="// Agenda Fondacio · guarda los datos del equipo en una carpeta de Google Drive.\n// Se pega una sola vez en script.google.com con la cuenta de Google de Fondacio\n// y se publica como \"Aplicación web\" (Ejecutar como: yo · Quién tiene acceso: cualquier persona).\n// Cada computador guarda su propio archivo agenda-datos-<pc>.json en la carpeta \"Agenda Fondacio\".\n// Si en esa carpeta (o en su subcarpeta \"actas\") ponen actas en Word o Google Docs, la página avisa para cargarlas.\n// Las actas que se cargan en la página también se guardan en la subcarpeta \"actas\", y los historiales en \"historial\".\n\nvar CARPETA = 'Agenda Fondacio';\n\nfunction carpeta_() {\n  var it = DriveApp.getFoldersByName(CARPETA);\n  return it.hasNext() ? it.next() : DriveApp.createFolder(CARPETA);\n}\n\nfunction salida_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction esActa_(f) {\n  var n = f.getName(), t = f.getMimeType();\n  if (/^~\\$/.test(n) || /plantilla|gu[ií]a|instructivo/i.test(n)) return false;\n  return /\\.docx$/i.test(n) || (t === MimeType.GOOGLE_DOCS && /acta/i.test(n));\n}\n\nfunction actas_(c, lista) {\n  var dentro = function (fol) {\n    var it = fol.getFiles();\n    while (it.hasNext()) {\n      var f = it.next();\n      if (esActa_(f)) lista.push({ id: f.getId(), n: f.getName().replace(/\\.docx$/i, '') + '.docx', m: f.getLastUpdated().getTime() });\n    }\n  };\n  dentro(c);\n  var sub = c.getFoldersByName('actas');\n  if (sub.hasNext()) dentro(sub.next());\n}\n\nfunction doGet(e) {\n  var p = (e && e.parameter) || {}, c = carpeta_();\n  if (p.archivo) {\n    var f = DriveApp.getFileById(p.archivo), bytes;\n    if (f.getMimeType() === MimeType.GOOGLE_DOCS) {\n      var url = 'https://docs.google.com/document/d/' + f.getId() + '/export?format=docx';\n      bytes = UrlFetchApp.fetch(url, { headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() } }).getContent();\n    } else bytes = f.getBlob().getBytes();\n    return salida_({ ok: true, nombre: f.getName(), b64: Utilities.base64Encode(bytes) });\n  }\n  var desde = Number(p.desde || 0), datos = [], actas = [], it = c.getFiles();\n  while (it.hasNext()) {\n    var g = it.next(), n = g.getName(), m = g.getLastUpdated().getTime();\n    if (/^agenda-datos-[a-z0-9]+\\.json$/.test(n)) datos.push(m > desde && n !== 'agenda-datos-' + p.pc + '.json' ? { n: n, m: m, txt: g.getBlob().getDataAsString() } : { n: n, m: m });\n  }\n  actas_(c, actas);\n  return salida_({ ok: true, carpeta: c.getUrl(), datos: datos, actas: actas });\n}\n\n// Guarda un archivo (acta en Word, historial) en una subcarpeta. Si ya existe con ese nombre, lo reemplaza.\nfunction subir_(c, d) {\n  var nombre = String(d.nombre || '').replace(/[\\\\/:*?\"<>|]/g, '-').slice(0, 120);\n  var sub = d.carpeta === 'historial' ? 'historial' : 'actas';\n  if (!/\\.docx$/i.test(nombre)) return salida_({ ok: false, error: 'solo se guardan archivos de Word' });\n  var it = c.getFoldersByName(sub), fol = it.hasNext() ? it.next() : c.createFolder(sub);\n  var viejos = fol.getFilesByName(nombre);\n  while (viejos.hasNext()) viejos.next().setTrashed(true);\n  var blob = Utilities.newBlob(Utilities.base64Decode(d.b64), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', nombre);\n  var f = fol.createFile(blob);\n  return salida_({ ok: true, id: f.getId(), m: f.getLastUpdated().getTime(), url: f.getUrl() });\n}\n\nfunction doPost(e) {\n  var d = JSON.parse(e.postData.contents);\n  if (!/^[a-z0-9]{4,12}$/.test(d.pc || '')) return salida_({ ok: false, error: 'datos inválidos' });\n  if (d.subir) return subir_(carpeta_(), d.subir);\n  if (typeof d.txt !== 'string') return salida_({ ok: false, error: 'datos inválidos' });\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    var c = carpeta_(), n = 'agenda-datos-' + d.pc + '.json', it = c.getFilesByName(n);\n    if (it.hasNext()) it.next().setContent(d.txt); else c.createFile(n, d.txt, 'application/json');\n  } finally { lock.releaseLock(); }\n  return salida_({ ok: true });\n}\n\n// Para probar a mano en el editor: crea la carpeta y pide los permisos.\nfunction probar() {\n  Logger.log(carpeta_().getUrl());\n}\n";
const PC=(()=>{try{let id=localStorage.getItem("fondacio_pc");if(!id){id=Math.random().toString(36).slice(2,10);localStorage.setItem("fondacio_pc",id)}return id}catch(e){return"pc"+Math.random().toString(36).slice(2,8)}})();
const sinT=(k,v)=>k==="_t"?undefined:v;
let BASE=null;
function baseDe(){const m=new Map();for(const c of SYNC_COL)for(const x of S[c]||[])m.set(c+"|"+x.id,{j:JSON.stringify(x,sinT),t:x._t||0});for(const c of SYNC_UNO)m.set(c,{j:JSON.stringify(S[c]??null),t:(S.sellos||{})[c]||0});return m}
/* marca con la hora lo que cambió desde la última vez que se guardó */
function sello(){
  S.borrados=S.borrados||{};S.sellos=S.sellos||{};
  if(!BASE){for(const c of SYNC_COL)for(const x of S[c]||[])x._t=x._t||0;BASE=baseDe();return}
  const ahora=Date.now(),vivos=new Set();
  for(const c of SYNC_COL)for(const x of S[c]||[]){const k=c+"|"+x.id,b=BASE.get(k);vivos.add(k);x._t=b&&b.j===JSON.stringify(x,sinT)?b.t:ahora}
  for(const c of SYNC_UNO){const b=BASE.get(c);if(!b||b.j!==JSON.stringify(S[c]??null))S.sellos[c]=ahora}
  for(const k of BASE.keys())if(k.includes("|")&&!vivos.has(k))S.borrados[k]=ahora;
  BASE=baseDe();
}
function fusionar(L,R){
  const o={borrados:{...(R.borrados||{})},sellos:{}};
  for(const[k,t]of Object.entries(L.borrados||{}))o.borrados[k]=Math.max(t,o.borrados[k]||0);
  for(const c of SYNC_COL){const m=new Map();for(const x of[...(R[c]||[]),...(L[c]||[])]){const y=m.get(x.id);if(!y||(x._t||0)>(y._t||0))m.set(x.id,x)}
    o[c]=[...m.values()].filter(x=>{const b=o.borrados[c+"|"+x.id];return!(b&&b>=(x._t||0))})}
  const vacio=v=>v==null||(Array.isArray(v)?!v.length:typeof v==="object"&&!Object.keys(v).length);
  for(const c of SYNC_UNO){const a=(L.sellos||{})[c]||0,b=(R.sellos||{})[c]||0;o[c]=vacio(R[c])?L[c]??null:vacio(L[c])||b>a?R[c]:L[c];o.sellos[c]=Math.max(a,b)}
  /* una sola acta por fecha: si dos computadores cargaron la misma, queda una */
  const porF=new Map();for(const a of o.actas){const y=porF.get(a.fecha);if(!y){porF.set(a.fecha,a);continue}
    const gana=(!!y.auto!==!!a.auto)?(y.auto?a:y):((a._t||0)>(y._t||0)?a:y),pierde=gana===a?y:a;porF.set(a.fecha,gana);o.borrados["actas|"+pierde.id]=Math.max(o.borrados["actas|"+pierde.id]||0,(pierde._t||0)+1)}
  o.actas=[...porF.values()];
  return o;
}
const compartido=()=>{const d={};for(const c of[...SYNC_COL,...SYNC_UNO,"sellos","borrados"])d[c]=S[c];return d};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}};
var SY={url:LS("fondacio_drive")||"",estado:"off",ult:0,ocupado:false,otra:false,escrito:LS("fondacio_escrito")||"",desde:0,t:0,callado:false,carpeta:"",err:""};
const urlOk=u=>/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]{20,}\/exec$/.test(u);
/* la página publicada (GitHub Pages): el link del equipo siempre apunta ahí para que abra en cualquier computador o celular */
const PAGINA="https://andresprogma.github.io/fondacio/fondacio.html";
const linkEquipo=()=>(location.protocol==="https:"&&!/^(127\.0\.0\.1|localhost)/.test(location.host)?location.origin+location.pathname:PAGINA)+"#drive="+encodeURIComponent(SY.url);
function programarSync(){clearTimeout(SY.t);SY.t=setTimeout(sincronizar,1500)}
async function pedir(params,cuerpo){
  let r;try{r=await fetch(SY.url+(params?"?"+new URLSearchParams(params):""),cuerpo?{method:"POST",body:JSON.stringify(cuerpo)}:{})}catch(e){throw new Error("Sin conexión con Google Drive. Revisa el internet")}
  let j;try{j=await r.json()}catch(e){throw new Error("Google Drive no respondió bien. ¿El link del equipo está completo?")}
  if(!j.ok)throw new Error(j.error||"Google Drive no aceptó el pedido");return j;
}
async function sincronizar(){
  if(!SY.url)return;if(SY.ocupado){SY.otra=true;return}SY.ocupado=true;
  try{
    sello();
    const j=await pedir({desde:SY.desde,pc:PC});
    SY.carpeta=j.carpeta||"";let R=null,otros=0;
    for(const d of j.datos||[]){SY.desde=Math.max(SY.desde,d.m);if(d.n!==`agenda-datos-${PC}.json`)otros++;if(!d.txt)continue;try{const x=JSON.parse(d.txt);if(x&&x.v===1)R=R?fusionar(R,x):x}catch(e){}}
    if(otros&&LS("fondacio_unido")!==SY.url){/* la primera vez que este computador entra a un equipo con datos, se quitan sus actividades de ejemplo */
      S.eventos=S.eventos.filter(e=>!(EJEMPLOS.includes(e.titulo)&&!e._t&&!e.tareaId));BASE=null;sello();LS("fondacio_unido",SY.url)}
    if(R){
      const antes=JSON.stringify(compartido()),reales=()=>S.actas.filter(a=>!a.auto).map(a=>a.id+":"+(a._t||0)).sort().join(),r0=reales(),M=fusionar(compartido(),R);
      if(JSON.stringify(M)!==antes){
        Object.assign(S,M);BASE=baseDe();if(reales()!==r0)reconstruir();
        SY.callado=true;crearActaViernes();if(S.ui.cal&&!EQ().some(n=>llave(n)===llave(S.ui.cal)))S.ui.cal="";save();SY.callado=false;RF=null;
        render();renderCals();if(!$("#quien").hidden)pantallaQuien();
        if(SY.ult)toast("Llegaron cambios de otra persona del equipo");
      }
    }
    const txt=JSON.stringify({v:1,pc:PC,quien:S.ui.yo||"",...compartido()});
    if(txt!==SY.escrito){await pedir(null,{pc:PC,txt});SY.escrito=txt;LS("fondacio_escrito",txt.length<2e6?txt:"")}
    SY.estado="ok";SY.ult=Date.now();SY.err="";
    actasEnDrive(j.actas||[]);
  }catch(e){SY.estado="error";SY.err=e.message||String(e)}
  finally{SY.ocupado=false;pintarSync();if(SY.otra){SY.otra=false;programarSync()}}
}
/* actas en Word o Google Docs que alguien puso o cambió en la carpeta */
function actasEnDrive(lista){
  S.archivos=S.archivos||{};const nuevas=lista.filter(a=>S.archivos[a.id]!==a.m),k=nuevas.map(a=>a.id+a.m).join();
  if(!nuevas.length||SY.avisado===k)return;SY.avisado=k;
  toast(nuevas.length===1?`Hay un acta nueva o cambiada en Drive: ${nuevas[0].n}`:`Hay ${nuevas.length} actas nuevas o cambiadas en Drive`,"Cargar",async()=>{
    try{toast("Trayendo las actas de Drive…");const files=[];
      for(const a of nuevas){const j=await pedir({archivo:a.id});const b=Uint8Array.from(atob(j.b64),c=>c.charCodeAt(0));files.push(new File([b],a.n,{lastModified:a.m}))}
      const ar={...S.archivos};nuevas.forEach(a=>ar[a.id]=a.m);S.archivos=ar;await importarActas(files,{reemplazar:true,desdeDrive:true});save()}
    catch(e){toast(e.message)}});
}
async function conectarDrive(url){
  url=(url||"").trim();const m=url.match(/#drive=(.+)$/);if(m)url=decodeURIComponent(m[1]);
  if(!urlOk(url)){toast("Ese link no sirve. Debe ser el link del equipo o la dirección que termina en /exec");return false}
  SY.url=url;SY.desde=0;SY.escrito="";SY.ult=0;LS("fondacio_drive",url);LS("fondacio_escrito",null);
  SY.estado="ok";pintarSync();await sincronizar();
  if(SY.estado==="ok"){toast("Listo: esta página ya está conectada con el equipo");return true}
  toast(SY.err);return false;
}
function desconectarDrive(){SY.url="";SY.estado="off";LS("fondacio_drive",null);LS("fondacio_escrito",null);pintarSync();toast("Esta página ya no comparte con el equipo. Lo de aquí se queda")}
function pintarSync(){
  const el=$("#sync");if(!el)return;
  const hace=SY.ult?Math.round((Date.now()-SY.ult)/1000):0,cuando=!SY.ult?"ahora":hace<60?"hace un momento":`hace ${Math.round(hace/60)} min`;
  el.innerHTML=`<div class="sync">${
    SY.url&&SY.estado!=="error"?`<b><span class="pt" style="--c:#188038"></span>Compartido con el equipo</b><p>Guardado en Google Drive · revisado ${cuando}.</p><button class="btn txt" data-sy="info">Link del equipo</button>`:
    SY.url?`<b><span class="pt" style="--c:#D93025"></span>No se pudo hablar con Drive</b><p>${esc((SY.err||"").slice(0,140))} Lo que hagas se guarda aquí y se manda cuando vuelva la conexión.</p><button class="btn" data-sy="otra">Intentar otra vez</button>`:
    `<b><span class="pt"></span>Solo en este computador</b><p>Para que todo el equipo vea lo mismo desde cualquier computador o celular, abran el link del equipo.</p><button class="btn pri" data-sy="info">Compartir con el equipo</button>`}</div>`;
}
function formCompartir(){
  if(SY.url){
    abrir(`<div class="row between"><h2>Link del equipo</h2>${X}</div>
    <p>Este es el link que usa todo el equipo. Mándenlo por WhatsApp o correo: quien lo abra ve las mismas actividades, actas, compromisos y tableros, en cualquier computador o celular, sin instalar nada.</p>
    <label>Link del equipo<input id="lk" readonly value="${esc(linkEquipo())}"></label>
    <p class="hint">Cuídenlo como una contraseña: quien tenga el link puede ver y cambiar la agenda, y las actas tienen datos de niños. No lo publiquen en redes ni en grupos abiertos.</p>
    ${SY.carpeta?`<p class="hint">Los datos quedan en la carpeta <a href="${esc(SY.carpeta)}" target="_blank" rel="noopener">Agenda Fondacio</a> de Google Drive. Si ponen ahí un acta (en Word o en Google Docs con «acta» en el nombre), la página avisa para cargarla.</p>`:""}
    <div class="dact"><button class="btn txt del" id="desc">Dejar de compartir aquí</button><span class="sp1"></span><button class="btn pri" id="cop">${I.copy}Copiar el link</button></div>`);
    $("#x").onclick=cerrar;$("#cop").onclick=()=>{navigator.clipboard.writeText(linkEquipo()).then(()=>toast("Link copiado"),()=>{$("#lk").select();toast("Cópialo con Cmd+C o Ctrl+C")})};
    $("#desc").onclick=()=>{cerrar();desconectarDrive()};return;
  }
  abrir(`<div class="row between"><h2>Compartir con el equipo</h2>${X}</div>
  <h3>¿Ya te mandaron el link del equipo?</h3>
  <p class="hint">Ábrelo y listo. O pégalo aquí:</p>
  <div class="row"><input id="lkIn" placeholder="Pega el link del equipo" style="flex:1" aria-label="Link del equipo"><button class="btn pri" id="lkOk">Conectar</button></div>
  <h3 style="margin-top:20px">Crear el link del equipo (una sola vez, quien sepa de computadores)</h3>
  <div class="gpaso"><ol>
    <li>Entra a <a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener">script.google.com</a> con la cuenta de Google de Fondacio (la que va a guardar los datos).</li>
    <li>Borra lo que aparece, toca <b>Copiar el programa</b> aquí abajo y pégalo allá. Guarda con el disquete.</li>
    <li>Arriba a la derecha: <b>Implementar → Nueva implementación</b>. En el engranaje elige <b>Aplicación web</b>. «Ejecutar como»: <b>Yo</b>. «Quién tiene acceso»: <b>Cualquier persona</b>. Toca <b>Implementar</b>.</li>
    <li>Google pide permisos: <b>Autorizar acceso</b>, elige la cuenta, toca <b>Configuración avanzada → Ir a … (no seguro)</b> y <b>Permitir</b>. Sale ese aviso porque el programa es de Fondacio y no de una empresa; no le da acceso a nadie más.</li>
    <li>Copia la <b>URL de la aplicación web</b> (termina en <i>/exec</i>) y pégala arriba, donde dice «Pega el link del equipo».</li>
    <li>La página te da el link del equipo para mandarle a todos.</li></ol>
  <button class="btn" id="copGs">${I.copy}Copiar el programa</button></div>`);
  $("#x").onclick=cerrar;
  $("#copGs").onclick=()=>navigator.clipboard.writeText(CODIGO_DRIVE).then(()=>toast("Programa copiado: pégalo en script.google.com"),()=>toast("No se pudo copiar. Está en el archivo servidor-drive.gs"));
  $("#lkOk").onclick=async()=>{const b=$("#lkOk");b.disabled=true;b.textContent="Conectando…";if(await conectarDrive($("#lkIn").value))formCompartir();else{b.disabled=false;b.textContent="Conectar"}};
}
$("#sync").onclick=e=>{const b=e.target.closest("[data-sy]");if(!b)return;if(b.dataset.sy==="otra")sincronizar();else formCompartir()};
/* el link del equipo trae la dirección en #drive=…: se guarda y se borra de la barra */
(()=>{const m=location.hash.match(/#drive=(.+)$/);if(!m)return;const u=decodeURIComponent(m[1]);history.replaceState(null,"",location.pathname+location.search);
  if(urlOk(u)&&u!==SY.url){SY.url=u;SY.desde=0;SY.escrito="";LS("fondacio_drive",u);LS("fondacio_escrito",null)}})();
setInterval(()=>{if(SY.url&&!document.hidden)sincronizar();else pintarSync()},30000);
document.addEventListener("visibilitychange",()=>{if(SY.url&&!document.hidden)sincronizar()});

if(movil()||S.ui.panel!=="asis")S.ui.panel=null;
if(crearActaViernes())save();
if(!S.equipo){S.equipo=equipoInicial();save()}
if(S.ui.cal&&!EQ().some(n=>llave(n)===llave(S.ui.cal)))S.ui.cal="";
renderCals();aplicarUI();render();renderChat();
pantallaQuien();
pintarSync();if(SY.url){SY.estado="ok";sincronizar()}
</script>
</body>
</html>
